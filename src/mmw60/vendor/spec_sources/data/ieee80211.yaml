  edmg.sc_params:
    value: {n_cb: 1, chip_rate_hz: 1760000000.0, block_chips: 512, gi_short_chips: 32, gi_normal_chips: 64, gi_long_chips: 128, data_symbols_normal_gi: 448}
    unit: "-, Hz, chips, chips, chips, chips, symbols"
    source: spec
    cite: "C. Cordeiro (Intel), 'Specification Framework for TGay', IEEE 802.11-15/1358r9, 2016；mentor.ieee.org 公开文件，2026-11-16 读原文"
    section: "6.5.6.1 Guard interval definition, Table 25（NCB = 1）；6.5.4 Encoding of EDMG-Header-B；MAC 部分 spoofing 一句（512*Tc）"
    quote: "Three types of GIs are defined: short, normal and long. An EDMG STA shall support the normal GI for each combination of channel bandwidth and number of spatial streams supported by the EDMG STA. All GI sequences are defined at the NCB×1.76 GHz sampling rate, where NCB is the integer number of 2.16 GHz channels that make up the channel bandwidth and 1 ≤ NCB ≤ 4. [...] Table 25 —GIe definition for 2.16 GHz (NCB = 1) channel: 1 GIe132 = -GA132, GIe164 = +Ga164, GIe1128 = -GA1128 [...] For single channel transmission, each codeword csi is modulated using π/2-BPSK modulation. This creates a SC data block, blki, of length 448 chips for the ith spatial stream. [...] the spoofing error shall be smaller than one symbol block (512*Tc)"
    note: "EDMG SC 单信道：每个 SC 符号块 512 码片 = 保护间隔 + 数据；GI 是 π/2 旋转的 Golay 序列（第 i 流的 GIe：短 −Ga32、普通 +Ga64、长 −Ga128），所以短 / 长 GI 时每块数据是 480 / 384 个符号（由 512 − GI 得，原文这两个数在图里）。STA 必须支持普通 GI。与 DMG SC（dmg.phy_params，64 + 448）同一种块结构。用户 2026-11-16 对照 IEEE 802.11-2024 核对一致（该标准的许可禁止输入 AI，本库没有读标准，只读这份公开文件）。"

