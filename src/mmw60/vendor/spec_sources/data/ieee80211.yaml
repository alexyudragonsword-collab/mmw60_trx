# Vendored from spec_sources@a9af2614c47f66eb602738e7ae19e84d164199de: src/spec_sources/data/ieee80211.yaml
# Adapted-copy policy: see src/mmw60/vendor/__init__.py
# ieee80211 —— IEEE 802.11 条文（VHT / EHT / DMG / EDMG）、TGad 评估方法学，与 ITU-R M.2003 的 DMG 条文。
#
# 标签：spec（对过原文，带 quote 与 section）/ survey（未核实，note 写明）/ derived（只由本库的 spec、
# survey 条目推出，note 或 cite 是公式）。本表不收 assumed：哪个库自己的取舍留在那个库的本地表。
# 只有条目自己的标签行写成"标签词 + 冒号"，说明文字里不写，所以对四个标签各跑一次 grep -c
# 都恰好等于该标签的条目数（tests/test_iron_rules.py 跑真的 grep）。
#
# 出处：条目从 mmw60_trx@13024e0b012923071d827cc557b0da5eb9a9b2aa src/mmw60/data/spec/survey.yaml
# 逐字迁入，每个字段与源表相等（tests/test_extraction.py 对 tests/fixtures/ 里的副本逐条比）。
# 所以 cite / note 里的"本库"指 mmw60_trx，cairn/…、examples/…、tests/…、config.…、frontend.… 是它仓库里的路径，
# assumed.* 是它本地表里的条目；这些写法在条目下一次因核实而改动时改成明确的库名（ROADMAP）。
#
# 前缀：tgad_em.*、ieee80211.*、ieee80211ac.*、ieee80211be.*、ieee80211ay.*、dmg.*、edmg.*。
#
# dmg.* 的 PHY 数与 edmg.*：mmw60_trx 在本库 #29 里请求（2026-11-16）。IEEE 802.11-2024 的许可禁止把标准输入 AI，
# 本库不读标准，只读公开文件（TGad / TGay 在 mentor.ieee.org 的提案、R&S 白皮书 1MA220），用户对照标准核对过一致。

entries:

  # ------------------------------------------------------------ 11ad 评估方法学（TGad EM, IEEE 802.11-09/0296）
  tgad_em.pa_rapp_g:
    value: 4.65
    unit: V/V
    source: spec
    cite: "E. Perahia (Intel), 'TGad Evaluation Methodology', IEEE 802.11-09/0296r16, 2010-01-20；mentor.ieee.org/802.11/dcn/09/11-09-0296-16-00ad-evaluation-methodology.doc，2026-11-13 读原文"
    section: "3.2 Hardware impairments, 2. PA non-linearity model, c. CMOS PA model parameters"
    quote: "c. CMOS PA model parameters – AM-AM • g = 4.65 • Asat = 0.58 • s = 0.81"
    note: "小信号增益（原文 'the small gain signal'）。r09 版（2009）是 g = 5、Asat = 0.6、s = 0.71；r12 'Modified CMOS PA model'（2009-11-19）改成现值。0.3.0 前是 survey（只读到摘录）。"

  tgad_em.pa_rapp_asat:
    value: 0.58
    unit: V
    source: spec
    cite: "E. Perahia (Intel), 'TGad Evaluation Methodology', IEEE 802.11-09/0296r16, 2010-01-20；mentor.ieee.org/802.11/dcn/09/11-09-0296-16-00ad-evaluation-methodology.doc，2026-11-13 读原文"
    section: "3.2 Hardware impairments, 2. PA non-linearity model, c. CMOS PA model parameters"
    quote: "c. CMOS PA model parameters – AM-AM • g = 4.65 • Asat = 0.58 • s = 0.81"
    note: "饱和电平（原文 'the saturation level'），RMS 伏；Psat = Asat²（归一化负载）。"

  tgad_em.pa_rapp_p:
    value: 0.81
    unit: smoothness
    source: spec
    cite: "E. Perahia (Intel), 'TGad Evaluation Methodology', IEEE 802.11-09/0296r16, 2010-01-20；mentor.ieee.org/802.11/dcn/09/11-09-0296-16-00ad-evaluation-methodology.doc，2026-11-13 读原文"
    section: "3.2 Hardware impairments, 2. PA non-linearity model, c. CMOS PA model parameters"
    quote: "c. CMOS PA model parameters – AM-AM • g = 4.65 • Asat = 0.58 • s = 0.81"
    note: "原文记号 s（'the smoothness factor'），本表与 mmw60_trx 的代码记作 p。"

  tgad_em.pa_ampm_alpha:
    value: 2560.0
    unit: deg/V^q1
    source: spec
    cite: "E. Perahia (Intel), 'TGad Evaluation Methodology', IEEE 802.11-09/0296r16, 2010-01-20；mentor.ieee.org/802.11/dcn/09/11-09-0296-16-00ad-evaluation-methodology.doc，2026-11-13 读原文"
    section: "3.2 Hardware impairments, 2. PA non-linearity model, c. CMOS PA model parameters"
    quote: "– AM-PM • α = 2560 • β = 0.114 • q1 = 2.4 • q2 = 2.3"
    note: "AM-PM 的输出单位是度（原文 'in degrees'）。"

  tgad_em.pa_ampm_beta:
    value: 0.114
    unit: V
    source: spec
    cite: "E. Perahia (Intel), 'TGad Evaluation Methodology', IEEE 802.11-09/0296r16, 2010-01-20；mentor.ieee.org/802.11/dcn/09/11-09-0296-16-00ad-evaluation-methodology.doc，2026-11-13 读原文"
    section: "3.2 Hardware impairments, 2. PA non-linearity model, c. CMOS PA model parameters"
    quote: "– AM-PM • α = 2560 • β = 0.114 • q1 = 2.4 • q2 = 2.3"
    note: "见 tgad_em.pa_model_shape。"

  tgad_em.pa_ampm_q1:
    value: 2.4
    unit: exponent
    source: spec
    cite: "E. Perahia (Intel), 'TGad Evaluation Methodology', IEEE 802.11-09/0296r16, 2010-01-20；mentor.ieee.org/802.11/dcn/09/11-09-0296-16-00ad-evaluation-methodology.doc，2026-11-13 读原文"
    section: "3.2 Hardware impairments, 2. PA non-linearity model, c. CMOS PA model parameters"
    quote: "– AM-PM • α = 2560 • β = 0.114 • q1 = 2.4 • q2 = 2.3"
    note: "见 tgad_em.pa_model_shape。"

  tgad_em.pa_ampm_q2:
    value: 2.3
    unit: exponent
    source: spec
    cite: "E. Perahia (Intel), 'TGad Evaluation Methodology', IEEE 802.11-09/0296r16, 2010-01-20；mentor.ieee.org/802.11/dcn/09/11-09-0296-16-00ad-evaluation-methodology.doc，2026-11-13 读原文"
    section: "3.2 Hardware impairments, 2. PA non-linearity model, c. CMOS PA model parameters"
    quote: "– AM-PM • α = 2560 • β = 0.114 • q1 = 2.4 • q2 = 2.3"
    note: "见 tgad_em.pa_model_shape。"

  tgad_em.pa_model_shape:
    value: "AM/AM G(A) = g·A / (1 + (g·A/Asat)^(2p))^(1/(2p)); AM/PM Phi(A) = alpha·A^q1 / (1 + (A/beta)^q2) [deg]"
    unit: formula
    source: spec
    cite: "E. Perahia (Intel), 'TGad Evaluation Methodology', IEEE 802.11-09/0296r16, 2010-01-20；mentor.ieee.org/802.11/dcn/09/11-09-0296-16-00ad-evaluation-methodology.doc，2026-11-13 读原文"
    section: "3.2 Hardware impairments, 2. PA non-linearity model, a. Rapp AM-AM; b. Modified Rapp AM-PM"
    quote: "a. Rapp AM-AM G(A) = g A / (1 + (gA/Asat)^(2s))^(1/(2s)) in RMS Volts, where g is the small gain signal, s is the smoothness factor, Asat is the saturation level. b. Modified Rapp AM-PM Ψ(A) = α A^q1 / (1 + (A/β)^q2) in degrees"
    note: "公式在 .doc 里是嵌入的公式对象，文本取不出；转成 PDF 后渲染第 4 页读的，引文里的上下标按读图写成行内形式。与本条的 value 逐项一致（value 用 p 记 s）。0.3.0 前是 survey（按记忆写出）。"

  tgad_em.pn_model_shape:
    value: "PSD(f) = PSD0 · (1 + (f/f_z)^2) / (1 + (f/f_p)^2)  [dBc/Hz 形式：PSD0 + 10·log10(...)]"
    unit: formula
    source: spec
    cite: "E. Perahia (Intel), 'TGad Evaluation Methodology', IEEE 802.11-09/0296r16, 2010-01-20；mentor.ieee.org/802.11/dcn/09/11-09-0296-16-00ad-evaluation-methodology.doc，2026-11-13 读原文"
    section: "3.2 Hardware impairments, 1. phase noise, a. model"
    quote: "a. model PSD(f) = PSD(0) [ (1 + (f/fz)^2) / (1 + (f/fp)^2) ]"
    note: "公式读自渲染的第 4 页（同上）。TGad EM 自己的参数在 tgad_em.pn_params（PSD0 −90 dBc/Hz）；Liu 2025 只给 fp / fz / PSD0，并用 −93 dBc/Hz。r11（2009-11-18）'Modified phase noise model to single pole'，r09 是双极点（PSD0 −80 dBc/Hz，fp1 0.75 MHz，fp2 2 MHz）。"

  tgad_em.pn_params:
    value: {psd0_dbchz: -90.0, f_pole_hz: 1.0e+6, f_zero_hz: 100.0e+6, psd_inf_dbchz: -130.0}
    unit: "dBc/Hz, Hz, Hz, dBc/Hz"
    source: spec
    cite: "E. Perahia (Intel), 'TGad Evaluation Methodology', IEEE 802.11-09/0296r16, 2010-01-20；mentor.ieee.org/802.11/dcn/09/11-09-0296-16-00ad-evaluation-methodology.doc，2026-11-13 读原文"
    section: "3.2 Hardware impairments, 1. phase noise, b. parameters"
    quote: "b. parameters • PSD(0) = -90 dBc/Hz • Pole frequency fp = 1 MHz • Zero frequency fz = 100 MHz • Corresponding PSD(infinity) = -130 dBc/Hz"
    note: "TGad EM 自己的相噪参数（0.3.0 新增）。psd_inf 是原文写出的值，也等于 PSD0 + 20·log10(fp/fz)。"

  tgad_em.pn_sides:
    value: "transmitter and receiver"
    unit: text
    source: spec
    cite: "E. Perahia (Intel), 'TGad Evaluation Methodology', IEEE 802.11-09/0296r16, 2010-01-20；mentor.ieee.org/802.11/dcn/09/11-09-0296-16-00ad-evaluation-methodology.doc，2026-11-13 读原文"
    section: "3.2 Hardware impairments, 1. phase noise, c."
    quote: "c. impairment is modeled at both transmitter and receiver"
    note: "TGad EM 的约定：相噪在收发两侧各加一份（0.3.0 新增）。Liu 2025 没说加在哪一侧；mmw60_trx 的 assumed.pn_apply_sides 取的也是两侧。"

  tgad_em.pa_backoff_definition:
    value: "PA Backoff = 10·log10(Average TX Power / Psat)"
    unit: formula
    source: spec
    cite: "E. Perahia (Intel), 'TGad Evaluation Methodology', IEEE 802.11-09/0296r16, 2010-01-20；mentor.ieee.org/802.11/dcn/09/11-09-0296-16-00ad-evaluation-methodology.doc，2026-11-13 读原文"
    section: "3.2 Hardware impairments, 2. PA non-linearity model, d."
    quote: "d. Calculate backoff as the output power backoff from full saturation: PA Backoff = 10 log10(Average TX Power/Psat)"
    note: "回退从饱和输出功率算起（0.3.0 新增）。mmw60_trx 的 assumed.pa_obo_reference 取的 psat 口径就是这个定义。"

  tgad_em.pa_backoff_recommended_db:
    value: {ofdm: 8.0, single_carrier: 0.5}
    unit: dB
    source: spec
    cite: "E. Perahia (Intel), 'TGad Evaluation Methodology', IEEE 802.11-09/0296r16, 2010-01-20；mentor.ieee.org/802.11/dcn/09/11-09-0296-16-00ad-evaluation-methodology.doc，2026-11-13 读原文"
    section: "3.2 Hardware impairments, 2. PA non-linearity model, d."
    quote: "Note: a PA Backoff equal to 8 dB for OFDM and 0.5 dB for single carrier is recommended."
    note: "推荐值，不是规定（0.3.0 新增）。Liu 2025 的 OFDM 回退 8 dB（liu2025.pa_obo_db）与此相同。"

  # ------------------------------------------------------------ 推导：TGad EM 的 modified Rapp 在 p = 0.81 时的压缩点
  tgad_em.rapp_p1db_below_psat_db:
    value: 9.5
    unit: dB
    source: derived
    cite: "ModifiedRappPA().p_sat / .p1db，tgad_em.pa_rapp_* 参数（p = 0.81）"
    note: "1 dB 压缩点输出功率在饱和输出功率以下 9.5 dB；tests/test_pa.py 守着这个数。"

  # ------------------------------------------------------------ 信道化与每带宽的数据子载波数
  ieee80211ay.channel_centres_ghz:
    value: [58.32, 60.48, 62.64, 64.80, 66.96, 69.12]
    unit: GHz
    source: spec
    cite: "A. Lomayev, C. da Silva, A. Maltsev, M. Genossar, C. Cordeiro (Intel), A. Eitan (Qualcomm), '30.6.1 OFDM Signal Parameters', IEEE 802.11-17/0597r1, 2017-04-14；TGay 动议 #208 采纳（动议汇编 11-17/0186r37）；mentor.ieee.org 公开文件，2026-11-16 读原文"
    section: "30.6.1.3 DC relative shift to carrier frequency, Table 2（NCB = 1，信道 1–6）"
    quote: "Table 2: DC relative shift to carrier frequency — NCB 1: Channel # 1 Fc 58.32 GHz; 2 60.48; 3 62.64; 4 64.8; 5 66.96; 6 69.12; 7 71.28; 8 73.44"
    note: "2.16 GHz 信道 1–6 的中心频率（57–71 GHz）。同一张表还有信道 7（71.28 GHz）与 8（73.44 GHz，Liu 2025 用它），在 edmg.ofdm_pilot_tones_ncb1 的 fc_ghz；这一条的值仍只列 1–6，与迁入时相同。用户 2026-11-16 对照 IEEE 802.11-2024 核对一致（该标准的许可禁止输入 AI，本库没有读标准，只读这份公开文件）。"

  ieee80211ac.n_sd:
    value: {20.0e+6: 52, 40.0e+6: 108, 80.0e+6: 234, 160.0e+6: 468}
    unit: data subcarriers
    source: spec
    cite: "R. Stacey (Intel) ed., 'Proposed Specification Framework for TGac', IEEE 802.11-09/0992r21, 2011-01；mentor.ieee.org 公开文件，2026-11-16 读原文；20 / 40 MHz 的数读 IEEE 802.11-05/1102r4 'Joint Proposal: High throughput extension to the 802.11 Standard: PHY'（TGn 联合提案，2006-01）；mentor.ieee.org 公开文件，2026-11-16 读原文；80 MHz 的 234 另见 S. Azizi, E. Perahia, R. Stacey (Intel), J. Choi (LGE) et al., 'OFDMA Numerology and Structure', IEEE 802.11-15/0330r5, 2015-05-13；mentor.ieee.org 公开文件，2026-11-16 读原文"
    section: "TGac 框架：3.2.3 VHT preamble、3.2.4.6 Pilot subcarriers、3.2.4.7 OFDM modulation、R3.1.C；TGn 联合提案：Table 1 Timing related constants；TGax 11-15/0330r5：slide 18 'Number of Guard Tones'"
    quote: "(TGac) The number of subcarriers and pilots, including subcarrier positions, of VHT-LTF and VHT-DATA symbols in 20 and 40 MHz channels are the same as those for 11n HT-LTF and HT-DATA in 20 and 40 MHz channels. [...] The draft specification shall have 8 pilot tones, with the positions {±103, ±75, ±39, ±11}, for 80 MHz [...] The draft specification shall have 3 DC tones at (0, ±1) in the 80 MHz VHT data field. The draft specification shall have 5 null tones at the upper tone edges (tone indices 123, 124, 125, 126, 127) and 6 null tones at the lower tone edges (tone indices -128, -127, -126, -125, -124, -123) of the 80 MHz VHT data. [...] R3.1.C: Tone allocation for 160 MHz operation shall consist of two 80 MHz tone allocations. [...] (TGn, Table 1) NSD: Number of data subcarriers — legacy 20MHz 48, 20MHz HT 52, 40MHz HT 108 [...] (11-15/0330r5) The payload design of 4x Symbol 20MHz is exactly 11ac 80 MHz down-clocked by 4, meaning (6,5) guard tones, 3 DC nulls, payload 234 data, 8 pilots"
    note: "VHT 每个带宽的数据子载波数。20 / 40 MHz：TGac 框架写明与 11n 的 HT 相同，TGn 联合提案的表是 52 / 108。80 MHz：256 点里 3 个 DC、上 5 下 6 个边带空子载波、8 个导频，剩 234（TGax 的 11-15/0330r5 也写明 11ac 80 MHz 是 'payload 234 data, 8 pilots'）。160 MHz：两个 80 MHz 拼成，468。20 MHz 的 52 与 mmw60_trx 的 phy/mcs.py 一致。用户 2026-11-16 对照标准核对一致（IEEE 802.11 标准的许可禁止输入 AI，本库没有读标准，只读公开文件）。"

  ieee80211be.n_sd:
    value: {20.0e+6: 234, 40.0e+6: 468, 80.0e+6: 980, 160.0e+6: 1960, 320.0e+6: 3920}
    unit: data subcarriers
    source: spec
    cite: "'Specification framework for TGbe', IEEE 802.11-19/1262r23, 2021-01；mentor.ieee.org 公开文件，2026-11-16 读原文；20 MHz 的 234 读 S. Azizi, E. Perahia, R. Stacey (Intel), J. Choi (LGE) et al., 'OFDMA Numerology and Structure', IEEE 802.11-15/0330r5, 2015-05-13；mentor.ieee.org 公开文件，2026-11-16 读原文"
    section: "TGbe 框架：1.7.3 Segment parser（Nsd_total 表）；TGax 11-15/0330r5：slide 18"
    quote: "(TGbe) 802.11be uses 80 MHz segment parser with the following parameters for the proportional round robin scheme: RU aggregation | Nsd_total | Proportional ratio: 484+996 1448 1s:2s; 484+2×996 2428; 484+3×996 3408; 2×996 1960 1s:1s; 3×996 2940; 4×996 3920 1s:1s:1s:1s [...] (11-15/0330r5) The payload design of 4x Symbol 20MHz is exactly 11ac 80 MHz down-clocked by 4, meaning (6,5) guard tones, 3 DC nulls, payload 234 data, 8 pilots"
    note: "EHT 整带宽单个 RU 的数据子载波数：20 MHz = RU242 的 234（11-15/0330r5），160 / 320 MHz = 2×996 / 4×996 的 1960 / 3920（TGbe 框架的表）；80 MHz 的 980 = 1960 ÷ 2（同表比例 1s:1s），40 MHz 的 468 = 同表 484+996 的 1448 − 980。用户 2026-11-16 对照标准核对一致（IEEE 802.11 标准的许可禁止输入 AI，本库没有读标准，只读公开文件）。"

  # ------------------------------------------------------------ DMG 接收机：灵敏度表的前提、最大输入电平
  dmg.sensitivity_assumptions:
    value: {nf_db: 10.0, implementation_loss_db: 5.0}
    unit: dB
    source: spec
    cite: "IEEE 802.11-10/0433r2 'PHY/MAC Complete Proposal Specification'（TGad 采纳的完整提案规范文本，2010-05-18，C. Cordeiro et al.）；mentor.ieee.org 公开文件，2026-11-16 读原文"
    section: "21.3.3.8 Receive Sensitivity（Table 66 之前）"
    quote: "The PER shall be less than 1% (5% for MCS 0) for a PSDU length of 4096 octets (256 for MCS 0) with the MCS dependent input levels listed in the Table 66 defined at the antenna port(s). [...] The table below assumes 5 dB implementation loss and 10 dB noise factor (Noise Figure)."
    note: "DMG 灵敏度表（dmg.rx_sensitivity_dbm）的参考接收机：10 dB 噪声系数、5 dB 实现损耗，不是哪颗芯片的实测；作 NF 的保守一档。mmw60_trx 的门限表（它的 per_thresholds.yaml）是它自己接收机的实测，不再叠加这 5 dB。迁入时是二手转引（survey），现在读的是 TGad 采纳的提案文本原句；R&S 1MA220 的灵敏度表没写前提。用户 2026-11-16 对照 IEEE 802.11-2024 核对一致（该标准的许可禁止输入 AI，本库没有读标准，只读这份公开文件）。"

  dmg.rx_max_input_dbm:
    value: -33.0
    unit: dBm
    source: spec
    cite: "Recommendation ITU-R M.2003 (03/2012), 'Multiple Gigabit Wireless Systems in frequencies around 60 GHz'，2026-11-12 读原文"
    section: "Annex 1, 2.4.6 Maximum input level"
    quote: "A compliant receiver has a receiver maximum input level of at least −33 dBm for each of the modulation formats that the receiver supports."
    note: "接收机必须承受的最大输入电平，泄漏预算里作一条参考线。**这是 2012 年版的写法**；现行版 M.2003-2 (01/2018) 同一节改成了功率密度：'a receiver maximum input level at the receive antenna(s) of at least 10 microwatts/cm2'。按 60.48 GHz 换算，0 dBi 天线是 −37.1 dBm，2 dBi 是 −35.1 dBm，6 dBi 是 −31.1 dBm（−33 dBm 对应约 4 dBi）。IEEE 802.11 条文本身没有读到。"

  # ------------------------------------------------------------ 11ax / 11be LDPC 数据域
  ieee80211be.ldpc_tone_mapping_distance:
    value: {20.0e+6: 9, 40.0e+6: 12, 80.0e+6: 20, 160.0e+6: 20, 320.0e+6: 20}
    unit: tones
    source: spec
    cite: "'Specification Framework for TGax', IEEE 802.11-15/0132r17（页眉印 r15），2016-05-25；mentor.ieee.org 公开文件，2026-11-16 读原文；EHT 沿用读 'Specification framework for TGbe', IEEE 802.11-19/1262r23, 2021-01；mentor.ieee.org 公开文件，2026-11-16 读原文"
    section: "TGax 框架：3.3.2.1 Resource unit, edge and DC tones；3.3.3 Interleaver and encoder, Table 6；TGbe 框架：1.9 Interleaving for RUs and aggregated RUs"
    quote: "(TGax) The 2x996-tone RU employs a segment parser (as in 11ac) between the two 996-tone frequency segments and the LDPC tone mapper in each 996-tone segment uses DTM = 20. [...] Table 6 - BCC interleaver and LDPC tone mapper parameters — RU size (tones) | LDPC DTM: 26 1; 52 3; 106 6; 242 9; 484 12; 996 20 [...] (TGbe) 802.11be supports the following LDPC tone mapper parameters: For RU52+RU26: D_TM = 4. For RU106+RU26: D_TM = 6. Existing RUs: identical to 802.11ax."
    note: "LDPC 音调映射距离 D_TM：RU242 / 484 / 996 = 9 / 12 / 20；2×996 在每个 996 段内用 20，EHT 的 4×996 也按 80 MHz 分段，每段 20。TGbe 框架写明已有 RU 与 802.11ax 相同，只给新的组合 RU（52+26、106+26、484+242）另定。D_TM 只影响频率选择性信道上的 PER（平坦信道不变）；N_SD 必须整除 D_TM（234/9、468/12、980/20）。用户 2026-11-16 对照标准核对一致（IEEE 802.11 标准的许可禁止输入 AI，本库没有读标准，只读公开文件）。"

  ieee80211.ldpc_ppdu_encoding_thresholds:
    value: {l1296_over_648: 912, l1944_over_1296: 1464, l1944_over_1296_two_cw: 2916, punc_frac_a: 0.1, shrt_ratio_b: 1.2, punc_frac_c: 0.3}
    unit: bits / ratios
