    section: "7.2.1.16 Sector sweep (SS)、7.2.1.17 SS-Feedback、7.2.1.18 SS-ACK（Figure 9–11）；7.3a.1 Sector Sweep field（Figure 68）；9.6.0f Usage of mmWave Control modulation class"
    quote: "Figure 9 – SS frame: FrameControl 2, Duration 2, RA 6, TA 6, SS 3, SS Feedback 3, FCS 4 (octets) [...] Figure 10 – SS-Feedback frame: Frame Control 2, Duration 2, RA 6, TA 6, SS 3, SS Feedback 3, BRP Request 3, FCS 4 [...] Figure 11 – SS-ACK frame: (same fields) [...] Figure 68 – SS field format: Direction 1, CDOWN 9, Sector ID 6, Antenna ID 2, RXSS Length 6 (bits) [...] The mmWave Beacon, Sector Sweep frame, SS-Feedback, SS-ACK, and the first BRP packet in beam refinement shall always be transmitted using the mmWave Control modulation class."
    note: "扇区扫描帧（提案里叫 SS，标准里叫 SSW）= Frame Control 2 + Duration 2 + RA 6 + TA 6 + SS 3 + SS Feedback 3 + FCS 4 = 26 字节；SS-Feedback 与 SS-ACK 多一个 3 字节的 BRP Request，共 29。都用控制 PHY（MCS 0）发。按 27.5 Mb/s，26 字节的数据约 7.6 µs，加 3.564 µs 前导与头部（本库不登记这个和）。用户 2026-11-16 对照 IEEE 802.11-2024 核对一致（该标准的许可禁止输入 AI，本库没有读标准，只读这份公开文件）。"

