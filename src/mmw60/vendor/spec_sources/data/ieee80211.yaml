    unit: "Z × Z 循环移位量（-1 为零块）"
    source: spec
    cite: "IEEE 802.11-10/0433r2 'PHY/MAC Complete Proposal Specification'（TGad 采纳的完整提案规范文本，2010-05-18，C. Cordeiro et al.）；mentor.ieee.org 公开文件，2026-11-16 读原文（表格从 docx 逐格取，公式是嵌入图片、渲染出来读）"
    section: "21.3.8 Common LDPC parity matrices, Table 69–72"
    quote: "Four Low-Density Parity-Check (LDPC) codes are specified, each of a different rate but with a common codeword size of 672 bits. [...] A location with integer i denotes the cyclic-permutation sub-matrix Pi obtained from the Z x Z identity matrix by cyclically shifting the columns to the right by i elements. [...] Table 69 – Rate 1/2 LDPC code matrix: 40 - 38 - 13 - 5 - 18 - - - - - - -; 34 - 35 - 27 - - 30 2 1 - - - - - -; - 36 - 31 - 7 - 34 - 10 41 - - - - -; - 27 - 18 - 12 20 - - - 15 6 - - - -; 35 - 41 - 40 - 39 - 28 - - 3 28 - - -; 29 - 0 - - 22 - 4 - 28 - 27 - 23 - -; - 31 - 23 - 21 - 20 - - 12 - - 0 13 -; - 22 - 34 31 - 14 - 4 - - - 13 - 22 24 [...] Table 70 – Rate 5/8: 20 36 34 31 20 7 41 34 - 10 41 - - - - -; 30 27 - 18 - 12 20 14 2 25 15 6 - - - -; 35 - 41 - 40 - 39 - 28 - - 3 28 - - -; 29 - 0 - - 22 - 4 - 28 - 27 24 23 - -; - 31 - 23 - 21 - 20 - 9 12 - - 0 13 -; - 22 - 34 31 - 14 - 4 - - - - - 22 24 [...] Table 71 – Rate 3/4: 35 19 41 22 40 41 39 6 28 18 17 3 28 - - -; 29 30 0 8 33 22 17 4 27 28 20 27 24 23 - -; 37 31 18 23 11 21 6 20 32 9 12 29 - 0 13 -; 25 22 4 34 31 3 14 15 4 - 14 18 13 13 22 24 [...] Table 72 – Rate 13/16: 29 30 0 8 33 22 17 4 27 28 20 27 24 23 - -; 37 31 18 23 11 21 6 20 32 9 12 29 10 0 13 -; 25 22 4 34 31 3 14 15 4 2 14 18 13 13 22 24"
    note: "DMG 的四个 LDPC 码，码长 672、Z = 42；每格 i 是把 Z × Z 单位阵各列循环右移 i 位，-1 是零块。行数 8 / 6 / 4 / 3 对应码率 1/2、5/8、3/4、13/16。TGay 的 SFD 把 1344 码长的提升矩阵作用在这四张表上（edmg.ldpc_1344_lifting），提升矩阵里 -1 的位置与这里的零块逐格相同；672 码长的 7/8 矩阵（edmg.ldpc_672_r7_8）正好是这里 3/4 矩阵第 1+3、2+4 行之和（本库生成条目时用程序核对过）。用户 2026-11-16 对照 IEEE 802.11-2024 核对一致（该标准的许可禁止输入 AI，本库没有读标准，只读这份公开文件）。"

  dmg.data_encoding:
    value: {scrambler_polynomial: "x^7 + x^4 + 1", scrambler_period: 127, scrambler_init: "x1..x7 chosen per PPDU and sent in the 7-bit Scrambler Initialization header field", sc_n_cw: "ceil(Length*8 / ((L_CW/rho)*R))", sc_n_data_pad: "N_CW*(L_CW/rho)*R - Length*8", sc_n_blks: "ceil(N_CW*L_CW / N_CBPB)", sc_n_blk_pad: "N_BLKS*N_CBPB - N_CW*L_CW", ofdm_n_cw: "ceil(Length*8 / (L_CW*R))", ofdm_n_sym: "ceil(N_CW*L_CW / N_CBPS)", ofdm_n_pad: "R*N_SYM*N_CBPS - Length*8", ofdm_n_cw_recalc: "N_SYM*N_CBPS / L_CW", l_cw: 672}
    unit: "formula"
    source: spec
    cite: "IEEE 802.11-10/0433r2 'PHY/MAC Complete Proposal Specification'（TGad 采纳的完整提案规范文本，2010-05-18，C. Cordeiro et al.）；mentor.ieee.org 公开文件，2026-11-16 读原文（表格从 docx 逐格取，公式是嵌入图片、渲染出来读）"
    section: "21.3.9 Scrambler；21.5.3.2.2 Encoding（OFDM 的 LDPC encoding process）；21.6.3.2.2 Encoding（SC 的 LDPC encoding process）"
    quote: "The header and data fields (including data padding bits but excluding the scrambler initialization field), shall be scrambled by XORing each bit in turn with a length 127 periodic sequence generated by the polynomial S(x) = x7 + x4 + 1. [...] For each PPDU, the transmitter selects values for bits x1 through x7 of the scrambler. [...] The values selected are sent in the Scrambler Initialization field. [...] (SC) First the total number of data pad bits NDATA_PAD is calculated, using the number of LDPC codewords NCW: NCW = ceil(Length·8 / ((LCW/ρ)·R)), NDATA_PAD = NCW·(LCW/ρ)·R − Length·8 [...] NBLKS = ceil(NCW·LCW / NCBPB), NBLK_PAD = NBLKS·NCBPB − NCW·LCW [...] (OFDM) NCW = ceil(Length×8 / (LCW×R)), NSYM = ceil(NCW×LCW / NCBPS), NPAD = R×NSYM×NCBPS − Length×8; Recalculate NCW = NSYM·NCBPS / LCW"
    note: "DMG 数据域的扰码与填充。Length 是 PSDU 字节数，rho 是重复因子（1 或 2，MCS 1 为 2），N_CBPB 是每 SC 块的编码比特（π/2-BPSK 448），N_CBPS 是每 OFDM 符号的编码比特。填充的零与块填充比特都用扰码序列的延续来扰。rho = 2 时，每个码字的数据位后补 L_CW/(2 rho) 个零按 1/2 码编码，再把校验后半段换成数据位与一个每码字重置为全 1 的 PN 序列的异或（原文步骤 2.b）。用户 2026-11-16 对照 IEEE 802.11-2024 核对一致（该标准的许可禁止输入 AI，本库没有读标准，只读这份公开文件）。"

