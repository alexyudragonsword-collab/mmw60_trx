    quote: "Updated MCS table — MCS Index | Modulation | NCBPS | Repetition | Code Rate | Data Rate (Mbps): 9.1 π/2-QPSK 2 1 7/8 2695; 12.1 16-QAM 4 1 13/16 5005; 12.2 16-QAM 4 1 7/8 5390; 12.3 64-QAM 6 1 5/8 5775; 12.4 64-QAM 6 1 3/4 6930; 12.5 64-QAM 6 1 13/16 7508; 12.6 64-QAM 6 1 7/8 8085 [...] Constellation: Use the same constellation as in OFDM; Use constellation rotation as in lower SC modulation"
    note: "802.11-2016 新增的 DMG SC 扩展 MCS（R&S 1MA220 的 Table 4-1 有这几档的 EVM 与灵敏度：dmg.tx_evm_db、dmg.rx_sensitivity_dbm）。原文表把调制写作 16-QAM / 64-QAM，同一份 slide 9 说沿用低阶 SC 的 π/2 旋转，所以登记为 π/2-16QAM / π/2-64QAM。速率是原文取整的数，12.5 的精确值 7507.5 与 edmg.sc_rate_mbps 普通 GI 的同档相同。码率 7/8 是 13/16 码打掉 48 个校验位，见 dmg.ldpc_r7_8_punctured。用户 2026-11-16 对照 IEEE 802.11-2024 核对一致（该标准的许可禁止输入 AI，本库没有读标准，只读这份公开文件）。"

  dmg.ldpc_r7_8_punctured:
    value: {base_rate: "13/16", punctured_parity_bits: 48, codeword_bits: 624, info_bits: 546}
    unit: "-, bits, bits, bits"
    source: spec
    cite: "A. Kasher (Intel), 'Additional SC MCSs in clause 20 (DMG PHY)', IEEE 802.11-16/0233r0, 2016-02（802.11REVmc，即 802.11-2016 修订）；mentor.ieee.org 公开文件，2026-11-16 读原文；被打掉的是前 48 个校验位，读 Yan Xin et al. (Huawei), 'Rate 7/8 LDPC Code for 11ay', IEEE 802.11-16/1495r1, 2016-11；mentor.ieee.org 公开文件"
    section: "16/0233r0 slide 9 'Rate 7/8th'；16/1495r1 slide 'Rate 7/8 LDPC Code in 802.11REVmc'"
    quote: "(16/0233r0) Generated by puncturing (not transmitting) 48 parity bits from rate 13/16 code words; uses existing LDPC matrix of rate 13/16; transmitter just does not transmit the bits; receiver put equal likelihood for 1/0 for these bits. [...] (16/1495r1) Rate 7/8 LDPC is generated by puncturing the first 48 parity bits from rate 13/16 code words specified in 802.11ad. [...] The lengths of a source word and a codeword of the rate 7/8 code are 546 and 624, respectively."
    note: "DMG SC 扩展 MCS 的码率 7/8：用 13/16 的 672 位码字，发端不发前 48 个校验位（624 = 672 − 48，546 / 624 = 7/8），收端把这些位当等概率。EDMG 另有一个 672 位、588 信息位的 7/8 码（edmg.ldpc_672_r7_8），17/0214r1 的码率表把 7/8 的短码字写作 624/672。用户 2026-11-16 对照 IEEE 802.11-2024 核对一致（该标准的许可禁止输入 AI，本库没有读标准，只读这份公开文件）。"

  dmg.control_phy:
    value: {chip_rate_hz: 1760000000.0, spreading_sequence: "Ga32", spreading_factor: 32, modulation: "DBPSK", effective_code_rate: 0.5, stf_chips: 5120, cef_chips: 1152, header_bits: 40, min_payload_octets: 14, max_payload_octets: 1023}
    unit: "Hz, text, chips per symbol, text, -, chips, chips, bits, octets, octets"
    source: spec
    cite: "IEEE 802.11-10/0433r2 'PHY/MAC Complete Proposal Specification'（TGad 采纳的完整提案规范文本，2010-05-18，C. Cordeiro et al.）；mentor.ieee.org 公开文件，2026-11-16 读原文（表格从 docx 逐格取，公式是嵌入图片、渲染出来读）"
    section: "21.4.1 Introduction；21.4.3.1 Preamble；21.4.3.2 Header, Table 73；21.4.3.3 Data field（Scrambler、Encoder、Modulation、Spreading）"
    quote: "Control PHY uses the same chip rate as the SC PHY. [...] The Short Training field is composed of 38 repetitions of sequences Gb128(n) of length 128, followed by a single -Gb128(n) sequence (for synchronization) and then a single -Ga128(n) sequence. [...] The Channel Estimation field is the same as the Channel Estimation field of the SC PHY [...] Table 73 – Control PHY header fields: Reserved 1; Scrambler Initialization 4; Length 10 (Number of data octets in the PSDU. Range 14-1023.); Packet type 1; Training Length 5; Reserved bits 3; HCS 16 [...] The minimal payload length is 14 octets. [...] The control PHY header and data should be encoded using an effective LDPC code rate of ½, generated from the data PHY rate ¾ LDPC parity check matrix, with shortening. [...] Each data word is padded with zeros to create 504 total bits. [...] using differential binary phase shift keying (DBPSK) [...] The constellation points are spread using the sequence Ga32(n)"
    note: "MCS 0。STF = 38 个 Gb128 + −Gb128 + −Ga128 = 40 × 128 码片（2.909 µs），CEF 与 SC 相同 = 9 × 128 码片；两者合计 6272 码片 = 3.564 µs，即 dmg.phy_timing 的 control_preamble_s。头部 40 位 = 保留 1、扰码初值 4、Length 10、包类型 1、训练长度 5、保留 3、HCS 16。编码用 3/4 码矩阵加缩短得等效 1/2（每个数据字补零到 504 位，编码后去掉补的零），DBPSK 后用 Ga32 扩频。数据率 = 1.76 GHz ÷ 32 × 1/2 = 27.5 Mb/s（dmg.control_phy_rate_bps）。用户 2026-11-16 对照 IEEE 802.11-2024 核对一致（该标准的许可禁止输入 AI，本库没有读标准，只读这份公开文件）。"

  dmg.control_phy_rate_bps:
