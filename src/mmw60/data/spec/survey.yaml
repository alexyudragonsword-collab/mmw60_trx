# 本库自己的数字表（铁律 5）—— 本库的取舍（assumed）、本库的产出（derived）与 3 条留下的 survey。
#
# 关于外部世界的数（规范条文、论文与数据手册的数字、只由它们推出的 derived）自 2026-11-13 起
# 在共享库 spec_sources 里，按完整 SHA vendor 在 src/mmw60/vendor/spec_sources/data/*.yaml
# （mmw60_trx#21；PIN 见 src/mmw60/vendor/__init__.py）。mmw60.spec 把两张表合起来读，同一个键
# 出现两次直接报错。本文件只留本库的东西：
#
#   assumed  原文根本没说、本库自己定的数；note 写明为什么这样取、换了会动什么。
#   derived  用到本库的 assumed 或本库示例读数推出来的数；cite 写推导式。
#   survey   未核实的数里不进共享库的 3 条（值是本库仓库里的文件名，或姊妹库的综合估计）；
#            note 必须写“未核实”。
#   （第四个标签“规范原文”只在共享表里出现：本文件没有这一类。）
#
# 每张表每个标签都按 grep 计数核对（tests/test_spec_sources.py），所以文件头与注释里不写
# “标签词 + 冒号”的字串。任何代码都不得直接写这些数字：只能通过 mmw60.spec.survey(key) /
# value(key) 按 key 取，并把 source 一起带到结果里。

entries:

  # ------------------------------------------------------------ 本库自己定的（原文没说）
  # Liu 2025、11ad 评估方法学、规管、802.11 的条目在 vendored spec_sources 的 data/liu2025.yaml、
  # data/ieee80211.yaml、data/regulatory.yaml。
  assumed.base_bandwidth_hz:
    value: 20.0e+6
    unit: Hz
    source: assumed
    cite: "本库"
    note: "Liu 2025 未说基准带宽；取 VHT 20 MHz（64 点 FFT、56 有效音 = 52 数据 + 4 导频）。换 40/80 MHz 基准只改 N_SD 与交织表，PER–SNR 曲线在 AWGN 样信道上几乎不动。"

  assumed.snr_definition:
    value: "in-band per-active-subcarrier Es/N0"
    unit: text
    source: assumed
    cite: "本库"
    note: "Liu 2025 未定义 SNR。本库按每有效子载波 Es/N0 加噪；每样本口径（全采样带宽）与之差 10·log10(os·N_FFT/N_active)，64 点 / 56 音 / os=2 时为 3.6 dB，示例两种口径都打印。"

  assumed.pn_apply_sides:
    value: "both"
    unit: text
    source: assumed
    cite: "本库"
    note: "Liu 2025 未说相噪加在哪一侧。本库 TX、RX 各一份独立实现、同一 PSD（总相噪功率 +3 dB）；示例给 rx-only 灵敏度行。"

  assumed.cr_rms_delay_ns:
    value: 7.0
    unit: ns
    source: assumed
    cite: "本库；由 Fig. 4 的可观测事实反推（见 derived.isi_beyond_gi_k16_db），量级与 Maltsev et al., IEEE 802.11-09/0334r8 (CR, LOS) 的记忆不矛盾"
    note: "CR tap 表没有；用 wifitrx TDLChannel 指数 PDP、每包一个 Rayleigh 实现代替。Fig. 4 里 16× 在每个 MCS 上都不比 8× 差，而 16× 的 GI 只有 50 ns，所以原文信道落在 50 ns 之外的能量必须可忽略；指数 PDP 要满足 exp(−50 ns/τ) ≤ −30 dB 需 τ ≤ 7.2 ns，取 7 ns。第一版取 15 ns 时 K=16 的 ISI 底板 −14 dB，直接与 Fig. 4 矛盾（cairn/LOG.md 2026-11-06）。Fig. 4 曲线从 PER 1 到 1e-3 只跨约 3 dB，说明原文信道对每包近乎无衰落，所以示例另跑 flat 行并报两者之差。"

  assumed.cr_los_k_db:
    value: 10.0
    unit: dB
    source: assumed
    cite: "本库；CR LOS 场景的直射分量相对全部散射分量的功率比"
    note: "Fig. 4 曲线从 PER 1 到 1e-3 只跨约 3 dB（AWGN 样），纯 Rayleigh 指数 PDP 在 160 MHz 带宽内频选衰落会把曲线拉平、整体右移；LOS 占优（K = 10 dB）把每音衰落深度限制在约 ±3 dB。示例给 Rayleigh（K = None）与 flat 两个灵敏度行。"

  assumed.ce_smooth_tones:
    value: 3
    unit: tones
    source: assumed
    cite: "本库；wifitrx preamble.smooth_channel_estimate"
    note: "L-LTF 只有两段，原始信道估计的噪声是数据噪声的一半，低 SNR 下折合约 1.8 dB 损失；标准接收机都做频域平滑（MATLAB wlanVHTLTFChannelEstimate 默认 span 3 的记忆）。取 3 音；示例给 1 音（不平滑）灵敏度行。"

  assumed.pa_obo_reference:
    value: "psat"
    unit: text
    source: assumed
    cite: "本库"
    note: "Liu 2025 只说 'OBO 8 dB'。字面 OBO 是相对饱和输出功率 Psat；但 11ad EM 的 CMOS Rapp（p = 0.81）P1dB 在 Psat 以下 9.5 dB（tgad_em.rapp_p1db_below_psat_db），相对 Psat 回退 8 dB 等于平均功率在 P1dB 之上 1.5 dB，孤立 EVM 只有 −17 dB。主结果按字面 psat；示例另给 p1db 口径的灵敏度行。"

  assumed.rx_timing:
    value: "genie (frame start known)"
    unit: text
    source: assumed
    cite: "本库"
    note: "沿用 wifitrx 的做法（cal/sequence.score_views 对已知波形互相关）。包检测 / 符号定时误差不在里程碑 0 的 PER 里。"

  assumed.ppdu_fields_modelled:
    value: "L-STF (10 x 0.8 us), L-LTF (GI2 + 2 x 3.2 us), Data; L-SIG / VHT-SIG-A / VHT-STF / VHT-LTF / VHT-SIG-B omitted"
    unit: text
    source: assumed
    cite: "本库"
    note: "SIG 字段用 BPSK 1/2（≤ MCS0 的鲁棒性），对数据域 PER 结论无影响；VHT-LTF 与 L-LTF 在 1 流 20 MHz 上信道估计等价。导频值用 wifitrx 的伪随机 BPSK 序列（pilot_sequence seed 42）而非 11ac 的极性序列，对 CPE 跟踪等价。"

  assumed.scrambler_seed:
    value: 93
    unit: 7-bit integer
    source: assumed
    cite: "本库（与 MATLAB WLAN Toolbox 默认 93 相同）"
    note: "扰码初态对 PER 无影响。"

  # ------------------------------------------------------------ 推导
  derived.isi_beyond_gi_k16_db:
    value: -31.0
    unit: dB
    source: derived
    cite: "10·log10(exp(−T_GI(K=16) / τ_rms)) = 10·log10(exp(−50 ns / 7 ns))"
    note: "指数 PDP 在 K = 16 的 GI（0.8 µs / 16 = 50 ns）之外的能量份额；选 τ_rms 使它 ≤ −30 dB。"

  # ------------------------------------------------------------ 里程碑 1 拓扑 B：前端
  survey.dsp_ip_dpd_poly_p4:
    value: {ddr_r1_w16: {terms: 140, area_mm2: 8.026, f_clk_mhz: 682}, gmp510_w16: {terms: 255, area_mm2: 14.173, f_clk_mhz: 682}}
    unit: NanGate45 estimate
    source: survey
    cite: "alexyudragonsword-collab/dsp_ip@2887659e339c67c3819a27ac3da8e28ea93857f8 docs/results.md 'Parallelism × frequency × area', P = 4 rows"
    note: "未核实（姊妹库综合估计，yosys+OpenROAD，无功耗数）；2727 MSPS = 682 MHz × 4。"

  assumed.converter_enob_ref:
    value: 10.0
    unit: bit
    source: assumed
    cite: "本库"
    note: "1 GS/s 处的 ENOB 参考点（WiFi 7 芯片 12 bit DAC / 11 bit ADC 在 ≤ 1.28 GS/s 的量级）；K 倍速率按 assumed.converter_bits_per_octave 递减。"

  assumed.converter_bits_per_octave:
    value: 0.5
    unit: bit/octave
    source: assumed
    cite: "本库；趋势量级参考 Murmann ADC survey 的 Schreier FoM 包络（SNDR 每倍频 −3 dB）"
    note: "常数 Schreier FoM 下 ENOB 每倍采样率降 0.5 bit；常数 Walden FoM、恒功率下是 1 bit/octave（悲观端，示例 02 灵敏度）。"

  assumed.converter_backoff_db:
    value: 12.0
    unit: dB
    source: assumed
    cite: "本库；与 wifitrx RxParams.adc_backoff_db 相同"
    note: "OFDM rms 低于转换器满量程的余量（PAPR）。"

  assumed.pa60_psat_dbm:
    value: 15.0
    unit: dBm
    source: assumed
    cite: "本库；60 GHz CMOS PA 单路 Psat 的量级"
    note: "只影响绝对功率 / EIRP 列，不影响 OBO 固定时的 EVM。2026-11-12 对照读过原文的测量值：同组 65 nm 的三颗 PA 是 14.6 / 13.2 / 11.7 dBm，pa60.eumc2011_table1 汇编的 14 颗是 8–19.9 dBm（中位 12.45）。15 dBm 在这个范围里，量级没有问题；偏离测量值的是 Rapp 的形状（tgad_em.pa_rapp_p），不是 Psat。2026-11-12 起预设改用测量的 PA（assumed.pa60_surveyed_pick），这条只由 config.tgad_em_pa 读（灵敏度行：旧的 PA）。"

  assumed.pa60_gain_db:
    value: 20.0
    unit: dB
    source: assumed
    cite: "本库"
    note: "同上。2026-11-12 起预设改用测量的 23.2 dB（pa60.asada_eumc2011），这条只由 config.tgad_em_pa 读。"

  assumed.lo_leak_dbc:
    value: -30.0
    unit: dBc
    source: assumed
    cite: "本库；wifitrx TxParams.randomize 的 −32…−22 dBm 泄漏对 ~−10 dBm 调制器信号即 −22…−12 dBc，60 GHz 取校准前 −30 dBc"
    note: "零中频下落在 DC，CFO 纠正后偏到 2.94 MHz / SCS_eff 个子载波处。"

  assumed.rx_dc_dbc:
    value: -25.0
    unit: dBc
    source: assumed
    cite: "本库"
    note: "RX 自混频直流相对基带信号。"

  assumed.iq_mismatch:
    value: {gain_db: 0.25, phase_deg: 1.5, gd_mismatch_ps: 150, rail_ripple_db: 0.3, rail_gd_ripple_ns: 0.12}
    unit: wifitrx FreqDepIQImbalance
    source: assumed
    cite: "本库；wifitrx TxParams.randomize 各范围的中点"
    note: "绝对单位（ps、ns）：同一个器件在 K 倍带宽上的频率相关 IQ 不平衡随之变差，这是物理。"

  assumed.mcs_evm_margin_db:
    value: 3.0
    unit: dB
    source: assumed
    cite: "本库"
    note: "网格判定'能'的口径：损伤 EVM 底板要低于该 MCS 的 TX EVM 要求（wifitrx link/mcs.py tx_evm_limit_db）3 dB，给热噪声留余量。"

  assumed.dpd_rate_over_bw:
    value: 4.0
    unit: ratio
    source: assumed
    cite: "本库；dsp_ip dpd_poly 的目标 640 MSPS 对应 160 MHz（4×）"
    note: "DPD 数据通路采样率 = 4 × 信道带宽（5 阶预失真展宽）。"

  assumed.irr_after_cal_db:
    value: 45.0
    unit: dB
    source: assumed
    cite: "本库；wifitrx tx_iq / rx_iq 步骤的验收 spec 是 irr_db ≥ 50 dB（320 MHz），留 5 dB"
    note: "网格的'IQ 校准后'列用的每侧残余镜像抑制；示例 03 在每个 K 上实测校准后的 IRR，对不上时以实测为准。"

  # ------------------------------------------------------------ 里程碑 1 A3：同台表与 pJ/bit
  assumed.dsp_word_bits:
    value: 16
    unit: bit
    source: assumed
    cite: "本库；dsp_ip dpd_poly 的 w16 变体"
    note: "数字块（DPD、FFT、Viterbi 路径度量）的运算字宽；乘法能耗 ∝ 宽度²、加法 ∝ 宽度。"

  assumed.pa60_pae_max:
    value: 0.20
    unit: ratio
    source: assumed
    cite: "本库；60 GHz CMOS PA 在 Psat 处 PAE 的常见量级"
    note: "2026-11-12 对照：读过原文的峰值 PAE 16.3 / 15.0 / 14.3 %，Table I 汇编的 4.9–16.3 %；20 % 偏高。同日起预设改用测量的 16.3 %，这条只由 config.tgad_em_pa 读。只进 pJ/bit 列。回退下的 PAE 按 B 类规律 PAE(Pout) = PAE_max · sqrt(Pout / Psat)（frontend/pa.py），OBO 8 dB 处 7.9 %；换成 A 类（∝ Pout/Psat）PA 项再差 2.5 倍。未查具体器件。"

  assumed.lo_multiplier_law:
    value: "integer_n"
    unit: law
    source: assumed
    cite: "本库 impairments/phase_noise.py::profile_at_carrier；pll_simulator#71（d67043e 落地）"
    note: "pllsim 剖面怎么到载频：只接受整数的 f_c / f0。带倍频器的文件（pllsim export --multiply-by N，f_in/2 以内 N²·S + 底噪，以上只有底噪）只在自己的 f0 上原样使用，不再平移；不带倍频器的文件按理想规律 20·log10(N) 平移，没有底噪项。非整数比（原先 6.253 GHz 到 60.48 GHz 的 ×9.672）与分频一律报错。更正（2026-11-11）：原先的值是 '20log10'，对任意比值都平移，那一行不对应可实现的倍频器，已由 ×10 剖面替换。"

  assumed.lo_multiplier_floor_dbchz:
    value: -150.0
    unit: dBc/Hz
    source: assumed
    cite: "本库；倍频器输出端的加性相噪底，未查具体器件（pll_simulator ex22 的 −160 dBc/Hz 是对方的占位，没有出处）"
    note: "pllsim ×10 剖面的底噪参数。PLL 远端 ×10² 在 100 MHz 处 L(f) 约 −133.6 dBc/Hz，−150 与 −160 都埋在它下面（100 MHz 处 −150 比 −160 高 0.09 dB）；−140 / −130 比 −160 高 0.9 / 5.1 dB。示例 04 第 5 节有 −160 / −140 / −130 三档灵敏度行，每档一个入库的剖面文件。"

  assumed.lo_multiplier_spur_rejection_db:
    value: 40.0
    unit: dB
    source: assumed
    cite: "本库；倍频器对非选中谐波的抑制，未查具体器件（pll_simulator ex22 的占位值）"
    note: "只写进剖面文件的杂散表，引擎不消费：本库是线性化基带引擎，杂散结论不能背书（铁律 6）。4 MHz 小数杂散 ×10 后 −43.7 dBc 同样只在文件里。"

  assumed.pll60_power_mw:
    value: 40.0
    unit: mW
    source: assumed
    cite: "本库；60 GHz CMOS 频综（PLL + 倍频 + LO 缓冲）的功耗量级"
    note: "只进 pJ/bit 列，按定值计入每条 60 GHz 行（TX、RX 各一份）；未查具体器件，灵敏度节 ×0.5 / ×2。"

  assumed.pll_sub7_power_mw:
    value: 20.0
    unit: mW
    source: assumed
    cite: "本库；sub-7 GHz WiFi 频综的功耗量级"
    note: "只进 pJ/bit 列的 K = 1 行；未查具体器件，灵敏度节 ×0.5 / ×2。"

  survey.clock_profile_wu19:
    value: {file: "bench_wu19_spll_frac_52m_6p253g.yaml", f0_hz: 6.2530156e+9}
    unit: pllsim clock profile
    source: survey
    cite: "Halo_Serdes@13ef8438ab82c9d364ff24c591da33d64afbe598 data/clock_profiles/bench_wu19_spll_frac_52m_6p253g.yaml（pllsim 0.9.6 commit 67fe1c72 的 bench 预设输出；Wu 2019 JSSC 亚采样小数 PLL 6.253 GHz）"
    note: "未核实（姊妹库模型输出，不是实测）：不带倍频器的原始剖面，文件原样复制到 src/mmw60/data/clock_profiles/。更正（2026-11-11）：同台表不再用它（到 60.48 GHz 是 ×9.672，非整数，现在报错）；只留给理想 ×N 规律的测试（整数倍）。"

  survey.clock_profile_wu19_x10:
    value: {file: "pllsim_wu19_x10_60p48g_floor150.yaml", f0_hz: 60.48e+9, f_in_hz: 6.048e+9, multiply_by: 10, sensitivity_files: ["pllsim_wu19_x10_60p48g_floor160.yaml", "pllsim_wu19_x10_60p48g_floor140.yaml", "pllsim_wu19_x10_60p48g_floor130.yaml"]}
    unit: pllsim clock profile
    source: survey
    cite: "pll_simulator@d67043e1197692dc203287b437613f7b9db83bb7：pllsim export bench_wu19_spll_frac_52m_6p253g --set fout=6.048G --set osc.f0=6.048G --clock-profile <file> --multiply-by 10 --floor-dbchz=<F> --spur-rejection-db 40（F = −150，灵敏度 −160 / −140 / −130）"
    note: "未核实（姊妹库模型输出，不是实测）：Wu 2019 预设重调到 6.048 GHz 再过对方的 ×10 倍频器模型，510 点到 30.24 GHz。本库在本地检出的该 commit 上生成（对方 examples/out/ 不入库）；底噪与抑制度是 assumed.lo_multiplier_floor_dbchz / assumed.lo_multiplier_spur_rejection_db。同台表 'LO = pllsim wu19 x10' 各行用它。拓扑 A 的 ×3 / ×4（PLL 18.0 / 13.5 GHz）超出对方模型的 12 GHz 覆盖范围，没有对应文件。"

  assumed.cal_capture_symbols:
    value: 8
    unit: OFDM symbols
    source: assumed
    cite: "本库 calcheck.py；wifitrx 校准序列每次采集的长度，按符号数给"
    note: "示例 03 / 06 的每一列都用 8 个符号，所以采集的样本数随基准 FFT 点数变：11ac 20 MHz 基准（64 点）只有 1280 个样本，11be 80 MHz 基准（1024 点）有 17408 个。K = 32 的 640 MHz 列（52 音、10 MHz 音距）上 8 个符号不够 GMP 拟合：DPD 步一轮都没写入，仅发 EVM −22.8 dB，与不开 DPD 相同；32 个符号 −29.0 dB。示例 03 有 32 符号的灵敏度行。"

  assumed.pa_memory_model:
    value: "wifitrx_reference_pa"
    unit: model
    source: assumed
    cite: "本库 pamemory.py；wifitrx 的 ReferencePA（PA_DPD 的参考 PA：3 抽头输入 FIR → Saleh → 2 抽头输出 FIR），按本库前端的小信号增益 / Psat / 峰值 PAE 定标"
    note: "只用于 PA 记忆的灵敏度研究（示例 07）：一颗带电记忆的 PA 放进拓扑 B 的链路。它是 sub-7 GHz WiFi PA 的参考模型，不是 60 GHz 器件的测量；非线性（Saleh）也与预设的 modified Rapp 不同，所以表里只在同一颗参考 PA 的两种记忆规律之间读差值。预设与同台表仍是无记忆的 Rapp。"

  assumed.pa_memory_fir_fs_hz:
    value: 80.0e+6
    unit: Hz
    source: assumed
    cite: "本库；参考 PA 的记忆抽头按 80 MS/s 定义，即 12.5 ns 一个抽头（它作为 WiFi PA 在 20 MHz × 4 倍过采样下的原样）"
    note: "“记忆按秒固定”一端的抽头间隔：sub-7 GHz PA 的时间常数原样搬到 60 GHz，偏悲观。示例 07 有 320 MHz / 1.28 GHz（3.125 / 0.78 ns）两档灵敏度行，另一端是“记忆随信号缩放”（抽头永远隔一个样本）。fs_eff / fir_fs 必须是正整数（wifitrx 拒绝分数比）。未查 60 GHz PA 的实测记忆时间常数。"

  assumed.pa_memory_fir_fs_sensitivity_hz:
    value: [320.0e+6, 1.28e+9]
    unit: Hz
    source: assumed
    cite: "本库；assumed.pa_memory_fir_fs_hz 的灵敏度档：抽头 3.125 ns / 0.78 ns"
    note: "示例 07 末节用：记忆比 WiFi PA 快 4 倍 / 16 倍时，逐样本与匹配抽头间隔的差。都要整除 K = 32 的 5.12 GS/s。"

  assumed.pa_memory_obo_sweep_db:
    value: [7.0, 7.5, 8.0, 8.5, 9.0, 10.0, 12.0]
    unit: dB
    source: assumed
    cite: "本库；示例 07 的回退扫描格点（自 Psat），含预设的 8 dB"
    note: "DPD 的收益在 PA 接近饱和时断崖式消失，预设的 8 dB 正好在崖上：随信号缩放的那颗崖在约 7.2 dB，按秒固定的那颗晚 1–2 dB。单点上读 EVM 差读到的主要是崖，所以要扫回退、在同样的 EVM 上比回退。格点在崖附近取 0.5 dB，离开后放宽。"

  assumed.pa_memory_obo_sweep_coarse_db:
    value: [7.0, 8.0, 9.0, 10.0, 12.0]
    unit: dB
    source: assumed
    cite: "本库；示例 07 末节（记忆快慢）用的较粗格点"
    note: "只为控制示例的运行时间；插值出的回退代价比细格点粗约 ±0.3 dB。"

  assumed.pa_memory_target_evm_db:
    value: [-25.0, -27.0]
    unit: dB
    source: assumed
    cite: "本库；比较两种记忆规律时取的目标 TX EVM（DPD 之后，标准接收机口径）"
    note: "−25 dB 约是 11be MCS5–6 的发射 EVM 要求量级，−27 dB 接近本库前端上 DPD 后的地板（约 −28.5 dB）。读法：达到同一个目标各自要退多少，差值就是按秒固定的记忆在输出功率上的代价。"

  assumed.pa_memory_dpd_candidates:
    value: [2, 4]
    unit: samples
    source: assumed
    cite: "本库；DPD 基函数抽头间隔的候选，另外总是量 1（逐样本）和 fs_eff / fir_fs（匹配）"
    note: "抽头间隔在链路上量着选，不直接取 fs_eff / fir_fs：预失真器与 PA 之间的发射基带低通带来逐样本的记忆，稀疏基函数表示不了（wifi_trx_cal#5 的实测）。候选只有这几个，没有扫全。"

  # ------------------------------------------------------------ ROADMAP D4：前端的三个面（接收前端、收发隔离、发 / 收天线增益）
  # 读过原文与只读到摘要的接收前端、隔离度、天线、DMG 条目在 vendored spec_sources 的
  # data/frontend60.yaml 与 data/ieee80211.yaml（2026-11-13 迁走；那里的文件头记着两轮核对与一条撤回）。
  assumed.rx60_ladder_shape:
    value: "wifitrx_ladder_shifted"
    unit: model
    source: assumed
    cite: "本库 frontend/rxfront.py；wifitrx DEFAULT_LNA_STATES 的八档梯子整体平移；换档电平按 wifitrx chain/agc.py 的平衡点规则"
    note: "'anchored' 接收前端怎么从最高增益档的 NF / IIP3 / 增益变成 AGC 要的八档表：保留 wifitrx 梯子的增益步进与各档之间的相对关系，每档的 NF、IIP3、增益各加同一个 dB 数。换档电平按 wifitrx 自己的规则走（噪声对 IM3 的平衡点 t_i = (2·IIP3_i + NF_{i+1} + 常数) / 3）：整体平移时每个电平移 (2·ΔIIP3 + ΔNF) / 3，与增益无关；以官方表的电平为基准，所以什么都不给时就是 wifitrx 的梯子。读到的文献只给高 / 低两档增益（27 / 17 dB），其余档位是假设。"

  assumed.rx60_p1db_from_iip3_db:
    value: 9.6
    unit: dB
    source: assumed
    cite: "本库；三阶非线性的经验关系 IIP3 − P1dB ≈ 9.6 dB"
    note: "把 IIP3 折成**带内**输入 1 dB 压缩点时用。带外的压缩点（基带高通之前，雷达的泄漏碰到的那个）不能这样折出来，是另一个字段（frontend.rx_front.p1db_oob_dbm），没有出处就留空。真实前端的差值随级数与偏置变，常见 8–12 dB。"

  assumed.frontend_faces_pick:
    value: {rx_nf_db: 6.1, rx_iip3_dbm: -20.0, rx_gain_db: 27.0, tx_rx_isolation_db: 20.0, antenna_gain_tx_dbi: 2.0, antenna_gain_rx_dbi: 2.0}
    unit: "dB, dBm, dB, dB, dBi, dBi"
    source: assumed
    cite: "本库 config.surveyed_frontend；从上面的条目里各取一个数"
    note: "'surveyed' 一档取哪几个数是本库的选择：接收 NF / IIP3 / 高增益档增益与发 / 收天线增益都取同一颗通信收发机（rx60.comm_asada2011，读过原文），不取雷达芯片；收发隔离取不加 EBG 的下端 40 − 20 = 20 dB（保守，泄漏最大）。第一版取的天线是 6 dBi（antenna60.okada2013_dbi，至今没有读到原文），读到 Asada 原文后换成它自己的 2 dBi，6 dBi 留作灵敏度档。预设不用这一档，现有数字不动；示例 08 每张表都是灵敏度行。"

  # ------------------------------------------------------------ 60 GHz PA：本库的取舍与工作点（2026-11-12 / 13）
  # 读过原文的测量值（pa60.*）与平滑度的 derived 在 vendored spec_sources 的 data/pa60.yaml。
  assumed.pa60_operating_rule:
    value: {evm_limit_db: -21.0, measured_on: "PA alone, OFDM-like Gaussian envelope, equaliser complex gain removed (frontend.grid.pa_isolated_evm_db)"}
    unit: "dB"
    source: assumed
    cite: "本库；读法取自 pa60.wu_isscc2015：读过的 60 GHz 收发机都按'TX EVM 碰到 802.11ad 16-QAM 限值（−21 dB）时的平均输出'给 Pout"
    note: "拓扑 A / B 预设的 PA 工作点：PA 单独在 OFDM 波形上 EVM 刚好到 −21 dB 的那个回退。没有任何读过的原文给 60 GHz CMOS PA 在 OFDM 上的工作点（唯一一篇可能给的 MDPI 22 nm 那篇对脚本访问返回 403，没有去绕）。选择：(1) 只看 PA 单独，不看整条发射链——同台表各行共用一个前端实例（铁律 2），整链的 EVM 随 K 变，取整链会让每行的回退不同；(2) 用 802.11ad 16-QAM 的限值而不是 11ac / 11be 某个 MCS 的——这是读到的 60 GHz 发射机共同的额定条件。灵敏度（示例 09）：不算 AM/PM 时回退 7.1 dB；用汇编表中位的形状（Psat − P1dB 3.3 dB）6.7 dB；同一条规则用在 11ad 那颗 Rapp 上是 10.0 dB（Liu 的 8 dB 在那颗上已过 16-QAM 限值）。"

  derived.pa60_obo_at_evm_limit_db:
    value: 7.5
    unit: dB from Psat
    source: derived
    cite: "frontend.grid.obo_for_isolated_evm(ModifiedRappPA(p=pa60.asada_eumc2011_rapp_p), assumed.pa60_operating_rule.evm_limit_db, 'psat')；Gaussian 包络 32768 点，种子 3 得 7.457，保留一位小数"
    note: "拓扑 A / B 预设的回退（从 Psat 算），P1dB 之下 2.9 dB，平均输出 14.6 − 7.5 = 7.1 dBm。不同种子 7.46–7.59 dB。tests/test_pa60.py 复算。Liu 的预设（liu2025_table2）仍是 liu2025.pa_obo_db 的 8 dB。"

  assumed.pa60_surveyed_pick:
    value: {source: "pa60.asada_eumc2011", rapp_p: "pa60.asada_eumc2011_rapp_p"}
    unit: keys
    source: assumed
    cite: "本库 config.surveyed_pa；取一篇读过原文的 60 GHz CMOS PA"
    note: "取 Asada EuMC 2011 的理由：与接收前端的基准档同一个组、同一个工艺（一套芯片的读法）；读过原文；Psat − P1dB 4.6 dB 在 Table I 里偏软，对线性度是保守的一侧。Psat 14.6 dBm、增益 23.2 dB、峰值 PAE 16.3 % 直接取它；Rapp 的 p 由它的 Psat − P1dB 算出。AM/PM 没有出处，仍是 11ad 评估方法学的。回退量与参考点不在这一档里，由配置决定。2026-11-12 起拓扑 A / B 的预设（zero_if_60ghz 及建在它上面的）用这一档，回退仍是 Liu 的从 Psat 8 dB；Liu 的预设（liu2025_table2）不用。更正（2026-11-13）：预设的回退改由 assumed.pa60_operating_rule 定，从 Psat 7.5 dB（derived.pa60_obo_at_evm_limit_db）；Liu 的预设仍是 8 dB。"

  derived.irr_after_cal_measured_db:
    value: {20.0e+6: 57.3, 80.0e+6: 55.9, 160.0e+6: 53.4, 320.0e+6: 51.9, 640.0e+6: 48.1, 2560.0e+6: 40.2}
    unit: dB per side
    source: derived
    cite: "examples/expected/03_calibration_at_k.txt（2026-11-13，校准跑在预设的 PA 工作点上——从 Psat 回退 7.5 dB，wifitrx@7b8d08e）tx_iq / rx_iq 两步 irr_min_db 的较小值，按有效带宽。之前跑在 wifitrx 的默认驱动上：2026-11-12（测量的 PA，落在回退 6.9 dB）56.3 / 56.8 / 52.9 / 50.9 / 47.6 / 38.5；换 PA 之前（2026-11-11）55.3 / 55.2 / 50.4 / 51.1 / 46.5 / 37.9"
    note: "示例 03 实测的校准后镜像抑制；同台表的 'IQcal' 列用它（取不大于该行带宽的最近一档），替代 assumed.irr_after_cal_db（ROADMAP A2 第一条）。示例 02 的网格仍用 45 dB 的假设值。"

  # ------------------------------------------------------------ 里程碑 1 A2：11be 编码 PER（EHT LDPC）
  assumed.eht_prefec_padding:
    value: "a=4 (HT/VHT procedure)"
    unit: rule
    source: assumed
    cite: "本库"
    note: "11be 数据域的预 FEC 填充按 HT/VHT 流程把 SERVICE+PSDU 填到整符号，不做 HE/EHT 的 a 因子（1–4）与 Packet Extension：PER 对此不敏感（只改最后一个符号的有效载荷），吞吐差 < 1 个符号。EHT 的 11 位扰码器也不建（PER 与扰码序列无关，仍用 7 位）。"

  assumed.ldpc_max_iterations:
    value: 30
    unit: iterations
    source: assumed
    cite: "本库；接收机算法选择"
    note: "归一化 min-sum 的最大迭代数（综合征为零即提前停止）；30 次在 1944 码上离 50 次的 PER 差 < 0.1 dB 量级，功率列按它计 LDPC 解码能耗。"

  assumed.ldpc_minsum_scale:
    value: 0.8
    unit: ratio
    source: assumed
    cite: "本库；接收机算法选择"
    note: "归一化 min-sum 的缩放因子 α；0.75–0.8 是这类码的常用值，LLR 的绝对尺度对 min-sum 无影响。"

  # ------------------------------------------------------------ A3：解码器上限
  assumed.decoder_cap_margin_db:
    value: 3.0
    unit: dB
    source: assumed
    cite: "本库"
    note: "'解码器上限'判定可达的口径：EVM 底板要比该 MCS 的 ideal 门限所容忍的噪声低 3 dB（−floor ≥ T + 3），此时底板吃掉 3.0 dB 灵敏度；取 0 dB 时所需 SNR 发散。同台表灵敏度节跑 1 / 6 dB 两端。与 assumed.mcs_evm_margin_db（发射机合规口径的余量）是两回事。"

  # ------------------------------------------------------------ 拓扑 A：IF 延伸（A1）
  assumed.ifext_if_hz:
    value: 6.48e+9
    unit: Hz
    source: assumed
    cite: "本库；6 GHz 频段（5.925–7.125 GHz）里的一个信道中心，使固定 LO 为整 54.0 GHz"
    note: "拓扑 A 的中频：芯片的信道所在的频率。载频 60.48 GHz 时 f_LO = 54.00 GHz。换信道靠芯片在 6 GHz 段内调 IF，固定 LO 不动（59.925–61.125 GHz 可达）。"

  assumed.ifext_lo_scheme:
    value: "fixed_lo_x3"
    unit: scheme
    source: assumed
    cite: "本库；60 GHz 常见的 LO 生成方式之一（约 20 GHz 的 PLL 接三倍频）"
    note: "固定 LO 的倍频数：×3（PLL 18.0 GHz）或 ×4（13.5 GHz）。相噪用参数化的 1 极 1 零剖面直接给在 LO 输出端，所以 N 只进频率规划与 PLL 频率，不改相噪数字；pllsim ×10 剖面那几行是零中频 60.48 GHz 的（survey.clock_profile_wu19_x10）；对方模型不覆盖 18.0 / 13.5 GHz，拓扑 A 没有 pllsim 推出来的行（pll_simulator#71）。"

  assumed.ifext_filter:
    value: {bandwidth_hz: 1.2e+9, order: 5, ripple_db: 0.5, center_hz: 6.525e+9}
    unit: Chebyshev-I bandpass
    source: assumed
    cite: "本库；通带取整个 6 GHz 段（芯片在段内调 IF 换信道），0.5 dB 纹波 5 阶是 LTCC / 声学带通的常见量级，未查具体器件"
    note: "IF 带通滤波器的低通等效；信道离通带中心越远，带内纹波与群时延展宽越大。示例 06 有信道在通带边缘的灵敏度行。"

  assumed.ifext_image_rejection_db:
    value: 30.0
    unit: dB
    source: assumed
    cite: "本库；RF 预选滤波对 f_LO − f_IF 镜像带的抑制，未查具体器件"
    note: "接收侧镜像带的噪声折进信号带：噪声系数恶化 10·log10(1 + 10^(−IRR/10)) = 0.004 dB（30 dB）、0.41 dB（10 dB）。只有拓扑 A 有这一项（零中频没有镜像带），同台表里标出。"

  assumed.ifext_chip_seed:
    value: 5
    unit: seed
    source: assumed
    cite: "本库；wifitrx handoff/runner.build_calibrated_trx 的默认 seed"
    note: "拓扑 A 的芯片是 wifitrx 自己随机化损伤后跑完校准序列的收发机（芯片原样）；seed 选哪一颗芯片。示例 06 有换芯片的灵敏度行。"

  assumed.ifext_chip_oversampling:
    value: 4
    unit: x bandwidth
    source: assumed
    cite: "本库；wifitrx 自己的波形默认 4 倍过采样，DPD 的 ACLR 观测要 fs ≥ 3 × BW"
    note: "拓扑 A 里芯片的 DAC / ADC 采样率。拓扑 B 用 2 倍（fs_eff 已是数 GS/s）。"

  assumed.ifext_dpd_max_iterations:
    value: 2
    unit: iterations
    source: assumed
    cite: "本库；wifitrx cal/dpd_cal.py::calibrate_dpd 的默认 n_iter = 2"
    note: "60 GHz 观测回环上重训 DPD 时交给 wifitrx 的 DPD 步试的轮数。wifitrx 0.7.39 起该步自己在观测通路上读“不加预失真”和每一轮、写入最好的；本库再把它留下的放回同一输出功率，和芯片上原有的预失真器比，留好的。轮数越多在软压缩 PA 靠近饱和时越差：回退 8 dB 处观测读数 不加 / 第 1 / 2 / 3 轮是 −18.4 / −20.6 / −14.1 / +1.4 dB（示例 06 §3 用上限 3 展示）。"

  assumed.mlo_sub7:
    value: {carrier_hz: 5.5e+9, snr_db: 20.0}
    unit: sub-7 GHz link
    source: assumed
    cite: "本库；MLO 的 sub-7 链路取 5 GHz 段一个信道，SNR 20 dB"
    note: "拓扑 A 的 CFO 接法（铁律 3）：sub-7 链路用 L-STF + L-LTF 估出自己的 CFO，乘 f_c / f_sub7（= 11.0）预补偿 60 GHz 链路，残差 = sub-7 估计误差 × 频率比。前提是每台设备的 sub-7 LO、芯片 IF LO 与 60 GHz 固定 LO 同源一颗晶振（assumed.mlo_common_reference）。"

  assumed.mlo_common_reference:
    value: true
    unit: bool
    source: assumed
    cite: "本库；多链路设备各射频共用一颗参考晶振是常规做法"
    note: "不成立时（60 GHz 级自带晶振）sub-7 的估计与 60 GHz 的 CFO 无关，MLO 预补偿失效，2.42 MHz 落在芯片 L-STF 的 ±625 kHz 之外。"

  # ------------------------------------------------------------ C1 / C2：接收机改进
  assumed.cpe_window_symbols:
    value: 17
    unit: OFDM symbols
    source: assumed
    cite: "本库；接收机算法选择"
    note: "跨符号导频 CPE 的 MMSE 合并窗口（rx/tracking.py）。Liu K = 8 MCS0 flat 上 5 / 9 / 17 / 33 的 PER 1e-2 点在 2.5–2.9 dB 之间（逐符号 4.5 dB），对窗口不敏感：合并权重 g 由导频残差自己量，窗口只定平滑估计的噪声。少于 3 个符号的包退回逐符号。示例 00 的灵敏度行给 5 与 33。"

  assumed.ce_smooth_max_tones:
    value: 9
    unit: tones
    source: assumed
    cite: "本库；wifitrx DEFAULT_CE_SMOOTH_TONES = 9"
    note: "信道估计平滑跨度自动选的上限（rx/tracking.py::auto_smooth_span）；平坦信道上音数多时取到上限（996 音 100 % 的包），56 音上受估计自身散布限制只有约 2/3 的包取到（ROADMAP C6）；选择性信道上按估计自己的音间自相关取 1–3。"
