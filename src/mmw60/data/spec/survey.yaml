    source: assumed
    cite: "本库"
    note: "11be 数据域的预 FEC 填充按 HT/VHT 流程把 SERVICE+PSDU 填到整符号，不做 HE/EHT 的 a 因子（1–4）与 Packet Extension：PER 对此不敏感（只改最后一个符号的有效载荷），吞吐差 < 1 个符号。EHT 的 11 位扰码器也不建（PER 与扰码序列无关，仍用 7 位）。"

  assumed.ldpc_max_iterations:
    value: 30
    unit: iterations
    source: assumed
    cite: "本库；接收机算法选择"
    note: "归一化 min-sum 的最大迭代数（综合征为零即提前停止）；30 次在 1944 码上离 50 次的 PER 差 < 0.1 dB 量级，功率列按它计 LDPC 解码能耗。"

  assumed.ldpc_minsum_scale:
    value: 0.8
    unit: ratio
    source: assumed
    cite: "本库；接收机算法选择"
    note: "归一化 min-sum 的缩放因子 α；0.75–0.8 是这类码的常用值，LLR 的绝对尺度对 min-sum 无影响。"

  # ------------------------------------------------------------ A3：解码器上限
  assumed.decoder_cap_margin_db:
    value: 3.0
    unit: dB
    source: assumed
    cite: "本库"
    note: "'解码器上限'判定可达的口径：EVM 底板要比该 MCS 的 ideal 门限所容忍的噪声低 3 dB（−floor ≥ T + 3），此时底板吃掉 3.0 dB 灵敏度；取 0 dB 时所需 SNR 发散。同台表灵敏度节跑 1 / 6 dB 两端。与 assumed.mcs_evm_margin_db（发射机合规口径的余量）是两回事。"

  # ------------------------------------------------------------ 拓扑 A：IF 延伸（A1）
  assumed.ifext_if_hz:
    value: 6.48e+9
    unit: Hz
    source: assumed
    cite: "本库；6 GHz 频段（5.925–7.125 GHz）里的一个信道中心，使固定 LO 为整 54.0 GHz"
    note: "拓扑 A 的中频：芯片的信道所在的频率。载频 60.48 GHz 时 f_LO = 54.00 GHz。换信道靠芯片在 6 GHz 段内调 IF，固定 LO 不动（59.925–61.125 GHz 可达）。"

  assumed.ifext_lo_scheme:
    value: "fixed_lo_x3"
    unit: scheme
    source: assumed
    cite: "本库；60 GHz 常见的 LO 生成方式之一（约 20 GHz 的 PLL 接三倍频）"
    note: "固定 LO 的倍频数：×3（PLL 18.0 GHz）、×4（13.5 GHz）或 ×9（6.0 GHz）。相噪用参数化的 1 极 1 零剖面直接给在 LO 输出端，所以 N 只进频率规划与 PLL 频率，不改相噪数字。pllsim 剖面（model profile）放在 LO 频率 54.0 GHz 上，不在载频上；对方模型不覆盖 18.0 / 13.5 GHz，所以 pllsim 行是 ×9（survey.clock_profile_wu19_x9），经过倍频器的剖面与 lo.scheme 的倍频数对不上时报错。"

  assumed.ifext_filter:
    value: {bandwidth_hz: 1.2e+9, order: 5, ripple_db: 0.5, center_hz: 6.525e+9}
    unit: Chebyshev-I bandpass
    source: assumed
    cite: "本库；通带取整个 6 GHz 段（芯片在段内调 IF 换信道），0.5 dB 纹波 5 阶是 LTCC / 声学带通的常见量级，未查具体器件"
    note: "IF 带通滤波器的低通等效；信道离通带中心越远，带内纹波与群时延展宽越大。示例 06 有信道在通带边缘的灵敏度行。"

  assumed.ifext_image_rejection_db:
    value: 30.0
    unit: dB
    source: assumed
    cite: "本库；RF 预选滤波对 f_LO − f_IF 镜像带的抑制，未查具体器件"
    note: "接收侧镜像带的噪声折进信号带：噪声系数恶化 10·log10(1 + 10^(−IRR/10)) = 0.004 dB（30 dB）、0.41 dB（10 dB）。只有拓扑 A 有这一项（零中频没有镜像带），同台表里标出。"

  assumed.ifext_upclock:
    value: {changes: "digital baseband only", analog: "the chip's native channel K x base bandwidth", channels_from: "ieee80211be.n_sd"}
    unit: procedure
    source: assumed
    cite: "本库 config.if_extender_60ghz(k=…)、Mmw60Config 的校验、compare.scheme_matrix（拓扑 A × be_upclocked；用户 2026-11-15 定：只改数字基带）"
    note: "拓扑 A 的升频只改数字基带：芯片的 DAC / ADC、模拟低通、6 GHz 射频与它的 14 步校准都是原生信道 K × 基准带宽的那一套（同一颗芯片、同一份校准缓存），数字跑基准 PHY、时钟 ×K。所以 K × 基准带宽必须是芯片有的信道宽度（802.11be 的 20 / 40 / 80 / 160 / 320 MHz，取 ieee80211be.n_sd 的键），320 MHz 以上不做（那要改模拟，等于另一条拓扑）。CFO：前导也跟着升频，L-STF 范围 ±625 kHz × K；MLO 预补偿仍是预设，示例 11 §2 有关掉它的灵敏度行。"

  assumed.ifext_chip_seed:
    value: 5
    unit: seed
    source: assumed
    cite: "本库；wifitrx handoff/runner.build_calibrated_trx 的默认 seed"
    note: "拓扑 A 的芯片是 wifitrx 自己随机化损伤后跑完校准序列的收发机（芯片原样）；seed 选哪一颗芯片。示例 06 有换芯片的灵敏度行。"

  assumed.ifext_chip_pa_bypass:
    value: {tap: "mixer_output", pa_power: "off", coupler: "ahead_of_pa", coupler_atten: "recommended_minus_pa_gain", dpd_step: "off", tx_power_step: "table_only"}
    unit: procedure
    source: assumed
    cite: "本库 ifext.py::calibrated_chip(pa_bypass=True)；wifitrx TxParams.pa_enabled = False"
    note: "拓扑 A 的芯片 PA 旁路一档（ifext.chip_pa_bypass，预设不开）：IF 从芯片的混频器输出取，芯片 PA 断电、不计功耗。wifitrx 的交付序列在这条链上真跑：校准耦合器跟着移到 PA 前，衰减减去实测的 PA 大信号增益（11be 80 MHz 上 25.6 dB），使芯片接收机看到交付序列调好的电平；DPD 步不跑（芯片上没有要线性化的 PA）；tx_power 步只建表（没有输出可设）。另一种做法——带着 PA 按交付方式校准、链路上再旁路——没有建。原文没有这样的芯片模式，是本库的取舍。"

  assumed.ifext_rx_front60:
    value: {block: "rx_front_max_gain_state", applies_when: "rx_front_sourced", agc: "chip_ladder", observation_loopback: "past_the_lna"}
    unit: procedure
    source: assumed
    cite: "本库 ifext.py::MmwRxStage（lna_gain_db / lna_nf_db / lna_iip3_dbm）；sim/link.py::LinkSim._rx_nf_db（Friis 级联）"
    note: "拓扑 A 芯片前的 60 GHz LNA / 下混频：取共享前端 rx_front 的最高增益档（增益、NF、IIP3）当一级固定增益，芯片自己的梯子在后面做 AGC；灵敏度用 Friis 级联 NF。只在 rx_front 是 60 GHz 前端（sourced，如 config.surveyed_frontend）时加：预设的 WiFi 7 梯子就是芯片自己那颗 sub-7 梯子的替身，不重复计，所以预设的数不动。60 GHz 观测回环从混频器进，不过 LNA。60 GHz 段的增益台阶没有建（真实接收机可能有）。"

  assumed.ifext_chip_oversampling:
    value: 4
    unit: x bandwidth
    source: assumed
    cite: "本库；wifitrx 自己的波形默认 4 倍过采样，DPD 的 ACLR 观测要 fs ≥ 3 × BW"
    note: "拓扑 A 里芯片的 DAC / ADC 采样率。拓扑 B 用 2 倍（fs_eff 已是数 GS/s）。"

  assumed.ifext_dpd_max_iterations:
    value: 2
    unit: iterations
    source: assumed
    cite: "本库；wifitrx cal/dpd_cal.py::calibrate_dpd 的默认 n_iter = 2"
    note: "60 GHz 观测回环上重训 DPD 时交给 wifitrx 的 DPD 步试的轮数。wifitrx 0.7.39 起该步自己在观测通路上读“不加预失真”和每一轮、写入最好的；本库再把它留下的放回同一输出功率，和芯片上原有的预失真器比，留好的。轮数越多在软压缩 PA 靠近饱和时越差：回退 8 dB 处观测读数 不加 / 第 1 / 2 / 3 轮是 −18.4 / −20.6 / −14.1 / +1.4 dB（示例 06 §3 用上限 3 展示）。"

  assumed.mlo_sub7:
    value: {carrier_hz: 5.5e+9, snr_db: 20.0}
    unit: sub-7 GHz link
    source: assumed
    cite: "本库；MLO 的 sub-7 链路取 5 GHz 段一个信道，SNR 20 dB"
    note: "拓扑 A 的 CFO 接法（铁律 3）：sub-7 链路用 L-STF + L-LTF 估出自己的 CFO，乘 f_c / f_sub7（= 11.0）预补偿 60 GHz 链路，残差 = sub-7 估计误差 × 频率比。前提是每台设备的 sub-7 LO、芯片 IF LO 与 60 GHz 固定 LO 同源一颗晶振（assumed.mlo_common_reference）。"

  assumed.mlo_common_reference:
    value: true
    unit: bool
    source: assumed
    cite: "本库；多链路设备各射频共用一颗参考晶振是常规做法"
    note: "不成立时（60 GHz 级自带晶振）sub-7 的估计与 60 GHz 的 CFO 无关，MLO 预补偿失效，2.42 MHz 落在芯片 L-STF 的 ±625 kHz 之外。"

  # ------------------------------------------------------------ C1 / C2：接收机改进
  assumed.cpe_window_symbols:
    value: 17
    unit: OFDM symbols
    source: assumed
    cite: "本库；接收机算法选择"
    note: "跨符号导频 CPE 的 MMSE 合并窗口（rx/tracking.py）。Liu K = 8 MCS0 flat 上 5 / 9 / 17 / 33 的 PER 1e-2 点在 2.5–2.9 dB 之间（逐符号 4.5 dB），对窗口不敏感：合并权重 g 由导频残差自己量，窗口只定平滑估计的噪声。少于 3 个符号的包退回逐符号。示例 00 的灵敏度行给 5 与 33。"

  assumed.ce_smooth_max_tones:
    value: 9
    unit: tones
    source: assumed
    cite: "本库；wifitrx DEFAULT_CE_SMOOTH_TONES = 9"
    note: "信道估计平滑跨度自动选的上限（rx/tracking.py::auto_smooth_span）；平坦信道上音数多时取到上限（996 音 100 % 的包），56 音上受估计自身散布限制只有约 2/3 的包取到（ROADMAP C6）；选择性信道上按估计自己的音间自相关取 1–3。"

  # ------------------------------------------------------------ 里程碑 3：802.11ay 两种波形（单信道、EVM 口径；数字学经 spec_sources#29）
  assumed.ay_chain_rate:
    value: {ofdm_oversampling: 2, sc_samples_per_chip: 3}
    unit: samples per OFDM sample / per SC chip
    source: assumed
    cite: "本库；mmw60.ay.edmg.chain_rate"
    note: "两种 ay 波形跑在同一条链、同一个采样率上：OFDM 2.64 GS/s × 2 = SC 1.76 Gchip/s × 3 = 5.28 GS/s（edmg.ofdm_params、edmg.sc_params），前端是同一个实例（铁律 2）。链的滤波器按 2.16 GHz 信道间隔建（ieee80211ay.channel_centres_ghz 的间隔），TX / RX 低通角 1.40 / 1.21 GHz，在 OFDM 占用带宽（±0.91 GHz）与 SC 成形后的带宽（滚降 0.25 时 ±1.10 GHz）之外；两者的线性失真都由训练场估计、频域均衡吃掉。"

  assumed.ay_sc_pulse:
    value: {shape: root-raised-cosine, rolloff: 0.25, span_symbols: 16}
    unit: "-, -, chips"
    source: assumed
    cite: "本库；mmw60.ay.papr.rrc_taps"
    note: "单载波的成形脉冲。标准只给频谱模板，不给滤波器（模板没有进 spec_sources，没有对模板核对）。滚降决定 SC 的峰均比：合成数字学上 16-QAM 在 0.25 时比 OFDM 低约 2.9 dB（cairn/ay.md §3）。示例 15 给 0.15 / 0.35 的灵敏度行。接收端是同一个脉冲的匹配滤波。"

  assumed.ay_preamble:
    value: {stf_length: 128, stf_repeats: 16, golay_delays: "2^(K-1), ..., 2, 1", golay_weights: "+1", cef: "Golay pair of the block / DFT length, each behind a cyclic prefix of the GI", sc_guard: "Golay of the GI length"}
    unit: "chips or samples, repeats, -, -, -, -"
    source: assumed
    cite: "本库；mmw60.ay.golay、mmw60.sim.ay_link"
    note: "本库发的训练场与保护间隔：一段 128 点 Golay 序列重复 16 次估 CFO（以一个序列长为滞后，范围 ±fs/256：SC 在 1.76 GHz 上 ±6.875 MHz，OFDM 在 2.64 GHz 上 ±10.3 MHz）；一对与块 / DFT 同长的 Golay 互补序列各带一段 GI 长的循环前缀估信道（两者的谱之和处处相等）；SC 的保护间隔是 GI 长的 Golay 序列。原理照 DMG 的前导与 GI，序列本身（Ga / Gb 的 D、W）与布局（含 OFDM 包的前导以 1.76 GHz 单载波发）不在 spec_sources 里，所以 OFDM 的训练场在 2.64 GHz 上发。Golay 用拼接式构造（延迟 2^(K−1) … 1、权全 +1）。"

  assumed.ay_evm_payload:
    value: {units: 64, dcm: "DCM BPSK as QPSK points per tone, DCM QPSK as 16-QAM points per tone", pilots: "P16 of stream 1 on every symbol", coding: none}
    unit: "SC blocks or OFDM symbols, -, -, -"
    source: assumed
    cite: "本库；mmw60.sim.ay_link（第一轮只做 EVM 口径，用户 2026-11-16 定）"
    note: "EVM 口径的载荷：随机星座点，不编码、不扰码。每包 64 个 SC 块（28672 个数据符号，普通 GI）或 64 个 OFDM 符号（21504 个数据音）。DCM 两档按每个音实际承载的点数取星座（DCM BPSK 每音是 QPSK 点，DCM QPSK 是 16-QAM 点），OFDM 的 EVM 对星座几乎不敏感（包络是高斯的）。导频每个符号都是第 1 流的 P16，不乘逐符号的伪随机序列。"

  assumed.ay_receiver:
    value: {cfo: "STF lag-L autocorrelation, then pilots (OFDM) / the guards (SC)", ce_window_to_gi: true, sc_phase: interp, equaliser: "MMSE with the known noise variance on the channel estimate's scale (ZF with no noise; ay.sc_equalizer zf the sensitivity row) for SC; ZF per tone for OFDM", timing: "the chain's group delay from the envelopes (sim/link.envelope_lag)"}
    unit: rule
    source: assumed
    cite: "本库；mmw60.sim.ay_link"
    note: "ay 接收机的选择。信道估计只用一对 Golay 序列，不平滑时它自己的噪声在 in-band SNR 20 dB 上把 EVM 拉到 SC −18.4 / OFDM −17.4 dB；把估计的冲激响应截在 GI 以内（再留 GI/8 的前驱），噪声降 512 / 72 ≈ 8.5 dB，信道短于 GI 时什么也不丢——DMG 接收机的通常做法，标准不规定。SC 的相位跟踪在每块前后两段已知 GI 之间线性插值（sc_phase: interp）：每块只取尾部 GI 一个相位时，60 GHz 的相噪在 291 ns 的块里漂，预设回退上单开相噪，SC 64-QAM 每块一个相位读 −25.1 dB、插值读 −27.5 dB，OFDM（每个符号 16 个导频）−27.7 dB；插值是 OFDM 逐符号导频的对应做法。示例 15 给 block 的灵敏度行。2026-11-16 更正：SC 的 MMSE 噪声方差原按单位标度给（1/SNR），而信道估计带着链的增益（mean|h|² ≈ 0.064），正则化大了约 16 倍；flat 信道上只是整体缩放、被去偏抵消，多径下白丢约 1.4 dB（in-band SNR 12 dB、CR 信道）。现在按估计自己的标度给（mean|h|²/SNR）。"

  assumed.ay_sensitivity:
    value: {sensitivity: dmg.rx_sensitivity_dbm, reference_receiver: dmg.sensitivity_assumptions, sc_twin_by: [modulation order, code rate, repetition], sc_tables: [dmg.sc_mcs, dmg.sc_mcs_extended], ofdm_twin_by: [n_bpsc, code rate], implementation_loss: taken out, bandwidth: occupied}
    unit: "-"
    source: assumed
    cite: "本库；mmw60.ay.edmg.dmg_twin / ideal_threshold_db，mmw60.arraylink.ay_mcs_ranges"
    note: "按功率换距离要每个 EDMG MCS 的解码门限，spec_sources#29 没有 EDMG 灵敏度。本库的取法：EDMG MCS 若在 DMG 表里有同样每符号比特数、码率与重复的一档（SC 对 dmg.sc_mcs，按调制阶数、码率、重复；OFDM 对 dmg.ofdm_mcs，按每子载波编码比特数与码率——EDMG 的 DCM BPSK / DCM QPSK 每子载波 1 / 2 比特，与 11ad 的 SQPSK / QPSK 相同，edmg.ofdm_mcs 的注释说它们在 18/1152r0 之前就叫这两个名字），就用那一档的最低灵敏度，减去 kT·B（B 取该波形的占用带宽：SC 1.76 GHz、OFDM 352 个音 × 5.15625 MHz，与 ay 链路的带内 SNR 同一口径）和参考接收机的 10 dB NF、5 dB 实现损耗，得理想解码器的带内 SNR 门限。实现损耗拿掉，是因为本库把发射与接收两侧的损伤读成 EVM 底板、按噪声项加回去（与 be 行用本库实测门限的做法一致）；留着它就重复计了，示例 15 §9 有留着它的灵敏度行。SC 先对 dmg.sc_mcs，再对 802.11-2016 的扩展档 dmg.sc_mcs_extended（9.1、12.1–12.6，spec_sources#33 起有原文，2026-11-16 接上）：EDMG SC 的 QPSK 7/8、16-QAM 13/16 与 7/8、64-QAM 5/8 起各档由此有了门限。码率 7/8 的孪生档不是同一个码：DMG 的是 13/16 码打掉 48 个校验位（624 位，dmg.ldpc_r7_8_punctured），EDMG 的是自己的 672 位码（edmg.ldpc_672_r7_8）。仍没有对应档的（SC 的 BPSK 7/8 与 64-QAM 1/2，OFDM 的各 7/8、DCM BPSK 3/4 起、DCM QPSK 13/16 起、64-QAM 1/2）没有门限，不进距离表。2026-11-16 起 SC 的预设改用本库实测的门限（data/spec/ay_per_thresholds.yaml，spec_sources#33 的码，ay.edmg.threshold_db 的 rule=measured），这条规则只管 OFDM 与 SC MCS 1（重复 2 的编码没建），并作为 rule=twin 的灵敏度读法留着（两种波形同口径）。实测对它：BPSK / QPSK 在 DMG 原有档上 ±0.5 dB 以内；16-QAM、64-QAM 与扩展档的 7/8 上它悲观 1.4–4.3 dB（cairn/ay.md §9d），OFDM 的高阶档很可能也一样悲观。交叉核对：同调制同码率时比本库实测的 11be LDPC 门限高约 1–2 dB（示例 15 §9）：DMG 的码长 672、参考接收机都偏保守。"

  assumed.ay_operating_point:
    value: {rule: assumed.pa60_operating_rule, payload: "the waveform's fastest 16-QAM MCS", measured_on: "the ideal chain with only the PA on, flat, no noise (arraylink.ay_pa_alone_evm_db)"}
    unit: "-"
    source: assumed
    cite: "本库；mmw60.arraylink.ay_operating_obo_db，示例 10 §3d"
    note: "阵列一节里 ay 两种波形“各自的工作点”：把预设的规则（PA 单独时 EVM 刚好到 802.11ad 16-QAM 3/4 的发射限值 −21 dB，assumed.pa60_operating_rule）用在该波形自己的 16-QAM 载荷包络上，而不是 OFDM 型的高斯包络。共享实例的预设回退（7.5 dB）不动：示例 10 §3d 两种读法并列，预设回退一行就是所有行同一个工作点的读法。SC 的包络峰均比低，同一条规则给出的回退小得多（约 4 dB）；OFDM 的与预设相近（约 7.1 dB）。规则只看 PA，不看校准残差与相噪；那些在每个单元回退上的校准链底板里。"

  assumed.ay_ofdm_tone_order:
    value: {order: "the data tones of every OFDM symbol in ascending order, symbol after symbol", dcm: "not built"}
    unit: "-"
    source: assumed
    cite: "本库；ay.coding.coded_packet 的 OFDM 载荷，tools/measure_ay_thresholds.py"
    note: "EDMG OFDM 的 LDPC tone mapping（码字比特到数据子载波的排法）与 DCM 的配对不在 spec_sources 里（已请求）。本库的编码 OFDM 载荷把码字比特按顺序放到每个 OFDM 符号的数据子载波上（升序，一个符号接一个符号）。flat 信道上逐音迫零后各子载波 SNR 相同，比特怎么排不改 PER，所以 16-QAM、64-QAM 各档的 flat 门限不受这条影响；多径下要规范的 tone mapping 才对。DCM 档（MCS 1–10）的两个子载波怎么配对决定分集增益，没有规范的配对就不建，它们的门限仍按 assumed.ay_sensitivity 借 DMG 孪生档。"

  assumed.ay_sector_sweep:
    value: {frame: "DMG control PHY (MCS 0) per sector", threshold: "dmg.rx_sensitivity_dbm at MCS 0, the reference receiver taken out as in assumed.ay_sensitivity", transmit_sweep: "the far end on one element", receive_sweep: "behind the chosen transmit beam", bandwidth: "the SC chip rate (the control PHY is single carrier)", timing: "every sector one SSW frame (dmg.phy_timing control preamble + (dmg.control_phy header + dmg.ssw_frame octets) at dmg.control_phy_rate_bps), SBIFS apart; full codewords assumed (a lower bound)"}
    unit: "-"
    source: assumed
    cite: "本库；mmw60.ay.edmg.control_threshold_db，示例 10 §4d"
    note: "ay 自己的扇区扫描：每个扇区发一个 SSW 帧，用 DMG 控制 PHY（MCS 0，SC 加 Golay 扩频）发，远端要把最好那个扇区的帧解出来。门限按 assumed.ay_sensitivity 同一条规则从 MCS 0 的最低灵敏度反推（拿掉参考接收机的 NF 与实现损耗），带宽取 SC 的码片速率；注意灵敏度表对 MCS 0 的判据是 256 octets 上 PER 5 %，其他档是 4096 octets 上 1 %。发端扫描时远端只用一个单元（与 be 行靠 MLO 触发的训练同样的设定，assumed.array_training），收端扫描在选好的发端波束后面。扫一轮的时长（2026-11-16，spec_sources#33）：每个扇区一个 SSW 帧，帧长 = 控制 PHY 前导 3.564 µs（dmg.phy_timing）+ 头部 40 位与帧的 26 字节按 27.5 Mb/s（dmg.control_phy、dmg.ssw_frame、dmg.control_phy_rate_bps），帧间隔 SBIFS 1 µs。控制 PHY 把头部与数据切成 LDPC 码字、每个码字的校验位数固定，没填满的码字等效码率低于 1/2；切分规则不在 spec_sources 里，这里按每个码字都填满算，所以是下限。EDMG 的 short SSW（edmg.short_ssw，48 位）放在 EDMG PPDU 的数据域里，那个 PPDU 的前导长度不在 spec_sources 里，没算；TRN 字段也没有建。"

  assumed.ay_cal_probe:
    value: {standard: 11be, base_bandwidth_hz: 80.0e+6, k: 22, oversampling: 3}
    unit: "-, Hz, -, samples per probe sample"
    source: assumed
    cite: "本库；mmw60.calcheck.run_cal_ay"
    note: "在 ay 的链（2.16 GHz、5.28 GS/s）上跑 wifitrx 校准序列用的评分波形：wifitrx 的序列要一个带标准导频的 OFDM 波形，且采样率 = 带宽 × 整数过采样。2.16 GHz 配 5.28 GS/s 是 2.44 倍，不是整数；5.28 GS/s 的整数分之一里，1.76 GHz（× 3）既落在链的通带里，又能写成标准波形升频：11be 80 MHz × 22，996 个音、音距 1.71875 MHz，占 1.71 GHz。链自己的步骤（LPF 角频、IQ 的 FIR、DC、LO 泄漏）按链的参数走（tx.params.bandwidth_hz、lpf.fc_nominal_hz），探针只用于快照、终检和 DPD 训练。探针比 ay 波形窄：OFDM 占 ±0.92 GHz、SC 成形后 ±1.10 GHz，探针只到 ±0.86 GHz，带边的 IQ 校正是外推出来的，所以校准后的链要用 ay 波形自己再读（示例 15 §7–§8）。"
