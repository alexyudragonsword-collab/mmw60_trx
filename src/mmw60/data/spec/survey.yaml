    note: "TX 扫够不到 MCS0 的边时，每个扇区把训练场（GI2 + 2 个 L-LTF 符号）重复 R 次，跨重复按功率非相干累加：统计量仍是闭式的非中心卡方（自由度 ×R），不怕 CFO 残差与重复之间的相位漂移，代价是 TX 扫的时长 ×R。R 取 2 的幂，取 TX 扫的路径损耗不小于 MCS0 数据链路的最小 R（上限 256）。跨重复相干累加（每倍少要 3 dB 而不是约 1.5 dB，但要求重复之间相位稳定）是示例 10 §4b 的灵敏度列，算乐观上界。"

