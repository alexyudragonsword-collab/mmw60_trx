    note: "60 GHz 附近海平面氧吸收峰的常用整数估算，按载频不变用在所有载频上：它是峰值，57 / 66 GHz 两侧更小，偏离 60 GHz 的载频上偏保守（73.44 GHz 远在吸收带外，这个数不适用；示例 10 只在 60.48 GHz 上用它）。只进距离，不进路径损耗：阵列层的结论以路径损耗为准。示例 10 §3b 有 0 / 10 / 20 dB/km 的灵敏度行。原文（ITU-R P.676，经 spec_sources）待补：用户 2026-11-14 定先用估算、不开 issue，记 ROADMAP B。"

