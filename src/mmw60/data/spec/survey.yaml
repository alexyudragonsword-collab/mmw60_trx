    note: "拓扑 A / B 预设的 PA 工作点：PA 单独在 OFDM 波形上 EVM 刚好到 802.11ad MCS12（π/2-16QAM 3/4）发射 EVM 限值的那个回退。限值经 frontend.grid.operating_rule_evm_limit_db() 从 dmg.tx_evm_db 读（−21 dB）；2026-11-16 之前这里自己写着 −21.0，出处是 pa60.wu_isscc2015 幻灯片上那条线，两者相同，回退与预设都不动（ROADMAP C10 第一条）。没有任何读过的原文给 60 GHz CMOS PA 在 OFDM 上的工作点（唯一一篇可能给的 MDPI 22 nm 那篇对脚本访问返回 403，没有去绕）。选择：(1) 只看 PA 单独，不看整条发射链——同台表各行共用一个前端实例（铁律 2），整链的 EVM 随 K 变，取整链会让每行的回退不同；(2) 用 802.11ad 16-QAM 的限值而不是 11ac / 11be 某个 MCS 的——这是读到的 60 GHz 发射机共同的额定条件。灵敏度（示例 09）：不算 AM/PM 时回退 7.1 dB；用汇编表中位的形状（Psat − P1dB 3.3 dB）6.7 dB；同一条规则用在 11ad 那颗 Rapp 上是 10.0 dB（Liu 的 8 dB 在那颗上已过 16-QAM 限值）。"

