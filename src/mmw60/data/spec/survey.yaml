  assumed.array_training:
    value: {field: "GI2 + 2 L-LTF symbols of the base PHY, upclocked", estimator: "noncoherent_tones", success_within_db: 1.0, p_target: 0.99, timing: "mlo", sector_switch_s: 1.0e-7}
    unit: procedure
