source: derived
cite: 'tools/measure_thresholds.py (mmw60 0.1.0): PER 0.01 crossing of a 4096-byte packet on the ideal zero-IF chain (zero_if_60ghz(k=4).ideal(), flat channel), SNR
  per active subcarrier, 0.5 dB steps, up to 200 packets or 15 errors per point; the two points bracketing PER 0.01 run on to 60 errors or 3000 packets, log-linear
  interpolation; ci_db = 95 % bootstrap interval of the crossing from the counts'
note: 本库接收机自己的门限（LTF 信道估计、平滑跨度逐包自动选 + 跨符号导频 CPE 合并 + BCC Viterbi / min-sum LDPC，即 zero_if_60ghz 预设的接收机），不是规范数：接收机一改就要重量（tests/test_thresholds.py 复量一个点）。夹住 1e-2 的两点续跑到更多错包，每个门限的
  95 % 区间记在 ci_db（只含计数统计，不含 0.5 dB 网格上插值的误差）。11ac 只有 20 MHz 基准有编码数据域。
