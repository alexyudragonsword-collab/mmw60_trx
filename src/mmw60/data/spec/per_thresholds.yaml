cite: 'tools/measure_thresholds.py (mmw60 0.1.0): PER 0.01 crossing of a 4096-byte packet on the ideal zero-IF chain (zero_if_60ghz(k=4).ideal(), flat channel), SNR
  per active subcarrier, 0.5 dB steps, up to 200 packets or 15 errors per point, log-linear interpolation'
note: 本库接收机自己的门限（LTF 信道估计、平滑跨度逐包自动选 + 跨符号导频 CPE 合并 + BCC Viterbi / min-sum LDPC，即 zero_if_60ghz 预设的接收机），不是规范数：接收机一改就要重量（tests/test_thresholds.py 复量一个点）。统计散布约 ±0.3 dB（1e-2 处每点十几个错包；要更窄用 per_sweep 的 refine_errors 与 snr_at_per_ci）。11ac
  只有 20 MHz 基准有编码数据域。
