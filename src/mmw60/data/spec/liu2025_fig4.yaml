# Liu 2025 的 PER–SNR 曲线读图值：刊出版 Fig. 3 "Simulation results for different MCSs"（arXiv v1 里是 Fig. 4，v2 删图）。
# 横轴 SNR (dB) 0–35，纵轴 PER 1e-3–1。两组，各 9 条（K = 4 / 8 / 16 × MCS 0 / 1 / 4）：
#   impaired —— 实线，"considering hardware impairments (CFO, PN and PA)"；
#   ideal    —— 虚线，图例标 ", ideal"，正文 "without considering these non-idealities"。但 4× 的 ideal 也是 PER = 1，
#               所以它还带着 CFO（4.7 的门槛在 ideal 组照样起作用），去掉的只是相噪与 PA。本库的 ideal 组连 CFO 也关，
#               K = 4 两边不可比。
# 更正（2026-11-15）：2026-11-06 起这个文件只有一组，按 arXiv v1 读、当作"有损伤"；刊出版里那 9 条曲线逐点就是虚线的
# ideal 组（如 8× MCS4：17 dB 0.25、19 dB 0.022、21 dB 0.002），刊出版另画了实线的有损伤组。旧读数原样保留在 ideal 组。
# 读图：刊出版 PDF 第 6 页 400 dpi 渲染（ideal 组的 v1 读数是 300 dpi），精度约 ±0.2 dB；MCS4 有损伤两条在 31 dB 处仍在
# PER 0.05–0.1，读成平台（floor_per），不是"PER = 1"。
# tools/external_check.py 读这里，不读代码里的数。
source: survey
cite: "Liu 2025, IEEE Commun. Mag. vol. 63 no. 3 pp. 69–75 (Mar. 2025), doi 10.1109/MCOM.002.2400059, Fig. 3（用户 2026-11-15 提供的刊出版 PDF，读图者：本库）；ideal 组与 arXiv:2309.16813 v1 Fig. 4 逐点相同（本库 2026-11-06 读）"
note: "未核实：读图值，非原文数字表（刊出版原图读的，但仍是读图）。"
per_target: 1.0e-2
sets:
  impaired: "solid lines: CFO + PN + PA (Table II)"
  ideal: "dashed lines (', ideal'): without PN and PA; the CFO stays (4x is PER = 1 here too)"

