source: derived
cite: 'tools/measure_ay_thresholds.py (mmw60 0.1.0): PER 0.01 crossing of a 4096-byte PSDU in whole 672-bit codewords (ay.coding.ay_code: spec_sources#33''s dmg.ldpc_matrices,
  edmg.ldpc_672_r7_8 at 7/8) on the ideal chain (ay.coding.threshold_config: ay_60ghz ideal, flat channel), in-band SNR over the occupied band (SC the chip rate,
  OFDM the used tones; OFDM bits on the data tones in order, assumed.ay_ofdm_tone_order), 0.5 dB steps from 0.5 dB under the Shannon bound, up to 200 packets or 15
  errors per point; the two points bracketing PER 0.01 run on to 60 errors or 3000 packets (a sweep left without a crossing that way is run again from two steps under
  its last point on a new seed, up to 3 times; an interval wider than 0.5 dB runs the points just outside the bracket on as well), log-linear interpolation; ci_db
  = 95 % bootstrap interval of the crossing from the counts'
note: 本库接收机自己的 EDMG 门限（Golay 信道估计；SC 的 MMSE、OFDM 的逐音迫零；max-log LLR、归一化 min-sum），不是规范数；接收机或码一改就要重量（tests/test_ay_link.py 复量一个点）。SC MCS 1（重复 2）按 dmg.data_encoding 的
  rho = 2 码字（数据、数据 ⊕ PN、校验，spec_sources#43），接收端两份 LLR 相加、补的零已知。OFDM 的 DCM 档（MCS 1–10）按 edmg.ofdm_modulation_mapping 的静态配对（spec_sources#43），一对子载波联合解映射。不含扰码与填充规则（载荷是随机比特，扰码不改
  PER；PSDU 按整数个码字发）。OFDM 的比特按顺序放在数据子载波上（assumed.ay_ofdm_tone_order）：flat 信道上各子载波 SNR 相同，比特怎么排不改 PER；多径下还缺 16 / 64-QAM 的符号内交织置换（公开文件没有）。
