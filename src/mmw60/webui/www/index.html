<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mmw60 结果台</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>
<!-- One page, served by mmw60.webhost (app window / browser) or a phone WebView.
     It is a browser of computed results: every number comes from the JSON API,
     nothing here computes.  A changed form marks numbers stale, it never clears them. -->
<header class="appbar" id="appbar">
  <span class="logo"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x=".75" y=".75" width="16.5" height="16.5" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 9c1-5 2.5-5 3.5 0s2.5 5 3.5 0 2.5-5 3.5 0" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>mmw60</span>
  <nav class="tabs" id="bottom-nav" aria-label="screens">
    <a href="#system" id="nav-system" data-nav="system"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="4" width="6" height="5" rx="1"/><rect x="12" y="4" width="6" height="5" rx="1"/><rect x="7" y="13" width="6" height="4" rx="1"/><path d="M8 6.5h4M15 9v3.5h-2M5 9v6h2"/></svg><span data-zh="框图" data-en="Diagram">框图</span></a>
    <a href="#table" id="nav-table" data-nav="table"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14M8 5v10"/></svg><span data-zh="同台表" data-en="Table">同台表</span></a>
    <a href="#row" id="nav-row" data-nav="row"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4h14v4H3zM3 12h9M3 16h6"/><circle cx="15.5" cy="14.5" r="2.5"/></svg><span data-zh="行细节" data-en="Row">行细节</span></a>
    <a href="#calibration" id="nav-calibration" data-nav="calibration"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 16a7 7 0 1 1 12 0"/><path d="M10 11l3.5-4"/><circle cx="10" cy="11.5" r="1.2"/></svg><span data-zh="校准" data-en="Calibration">校准</span></a>
    <a href="#array" id="nav-array" data-nav="array"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M4 4v0M10 4v0M16 4v0M4 10v0M10 10v0M16 10v0M4 16v0M10 16v0M16 16v0"/></svg><span data-zh="阵列" data-en="Array">阵列</span></a>
    <a href="#ay" id="nav-ay" data-nav="ay"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 10c2-7 4-7 6 0s4 7 6 0 3-5 4-3"/></svg><span data-zh="SC·OFDM" data-en="SC·OFDM">SC·OFDM</span></a>
    <a href="#runs" id="nav-runs" data-nav="runs"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h12"/><circle cx="8" cy="5" r="1.8" fill="var(--panel)"/><circle cx="13" cy="10" r="1.8" fill="var(--panel)"/><circle cx="7" cy="15" r="1.8" fill="var(--panel)"/></svg><span data-zh="运行台" data-en="Runs">运行台</span><b class="bdg" id="nav-badge" hidden></b></a>
    <a href="#sources" id="nav-sources" data-nav="sources"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 3h8l3 3v11H5z"/><path d="M8 9h5M8 12h5M8 15h3"/></svg><span data-zh="出处" data-en="Sources">出处</span></a>
  </nav>
  <span class="pstrip" id="fresh-parts" aria-label="freshness of the parts"></span>
  <button type="button" class="pill" id="pill-fresh" data-act="go" data-v="runs"><span class="dot"></span><span id="pill-fresh-t">…</span></button>
  <button type="button" class="pill" id="pill-jobs" data-act="go" data-v="runs"><span id="pill-jobs-t">…</span></button>
  <button type="button" class="btn" id="nav-form" data-act="form" aria-expanded="false" aria-controls="form"><span data-zh="参数表单" data-en="Form">参数表单</span> <b class="cnt" id="form-count" hidden></b></button>
  <button type="button" class="btn" id="lang-toggle" data-act="lang" title="中文 / English">EN</button>
  <button type="button" class="btn" id="btn-theme" data-act="theme" title="light / dark / system">◐</button>
</header>
<div class="engine" id="engine"><b id="engine-line">engine: …</b> <span class="mut" data-zh="线性化引擎：杂散 / 互调结论不能背书" data-en="linearised engine: spur / intermodulation conclusions are not endorsed">线性化引擎：杂散 / 互调结论不能背书</span></div>
<div class="toast" id="toast" role="alert" hidden></div>

<main class="scr" id="main">
  <section class="screen" id="screen-system" hidden></section>
  <section class="screen" id="screen-table" hidden></section>
  <section class="screen" id="screen-row" hidden></section>
  <section class="screen" id="screen-calibration" hidden></section>
  <section class="screen" id="screen-array" hidden></section>
  <section class="screen" id="screen-ay" hidden></section>
  <section class="screen" id="screen-runs" hidden></section>
  <section class="screen" id="screen-sources" hidden></section>
</main>

<aside class="drawer" id="form" aria-label="form" hidden>
  <div class="drawer-h">
    <b data-zh="参数表单 · 共享旋钮" data-en="Form · shared knobs">参数表单 · 共享旋钮</b>
    <button type="button" class="btn" id="form-reset" data-act="resetall" hidden></button>
    <button type="button" class="btn" id="btn-form-close" data-act="form" aria-label="close">✕</button>
  </div>
  <p class="drawer-note" data-zh="改一个值不会立刻重算，也不会清空数字：读过它的结果只被标成过期，重算在运行台排队。" data-en="Changing a value does not recompute at once and clears nothing: the results that read it are marked stale, and the recompute is queued from Runs.">改一个值不会立刻重算，也不会清空数字：读过它的结果只被标成过期，重算在运行台排队。</p>
  <div id="form-body"></div>
</aside>

<div class="pop" id="pop" hidden></div><div class="tip" id="tip" hidden></div>

<script src="core.js"></script>
<script src="charts.js"></script>
<script src="table.js"></script>
<script src="detail.js"></script>
<script src="pages.js"></script>
<script src="system.js"></script>
<script src="runs.js"></script>
<script src="app.js"></script>
</body>
</html>
