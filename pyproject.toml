[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmw60"
version = "0.1.0"
description = "60 GHz WiFi transceiver behavioural simulation: IF-extender vs IMMW upclocking on one engine (vendored wifitrx)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["ruff>=0.6"]
# numba is a performance layer, not a correctness layer: MMW60_NO_JIT=1 must
# give bit-identical results (Halo_Serdes iron rule 4, tests/test_phy.py)
jit = ["numba>=0.59"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mmw60 = ["data/spec/*.yaml", "data/clock_profiles/*.yaml", "vendor/spec_sources/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running end-to-end runs (deselect with '-m \"not slow\"')",
]
# a spec key spec_sources has renamed reads with a DeprecatedKeyWarning; here it is an error, so no
# call site stays on an old name before spec_sources retires the aliases (0.3.0; mmw60_trx#23)
filterwarnings = [
    "error::mmw60.vendor.spec_sources.reader.DeprecatedKeyWarning",
]

[tool.ruff]
line-length = 120     # tools/example_drift.py and fingerprint_walk.py are d2d_link's files at its width
extend-exclude = ["src/mmw60/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
# d2d_link's files, taken as they are
"tools/example_drift.py" = ["E501"]
"tools/fingerprint_walk.py" = ["E501"]
# Chinese mechanism prose and the examples' report lines
"src/mmw60/calcheck.py" = ["E501"]
# eight tables of wide report lines
"examples/06_topology_a_if_extender.py" = ["E402", "E501"]
"examples/07_pa_memory_dpd.py" = ["E402", "E501"]
"examples/08_frontend_faces.py" = ["E402", "E501"]
"examples/09_pa_against_the_literature.py" = ["E402", "E501"]
"tools/measure_thresholds.py" = ["E501"]
"tools/external_check.py" = ["E501"]
"examples/00_liu2025_per_vs_snr.py" = ["E501"]
"examples/02_upclock_grid.py" = ["E501"]
"examples/03_calibration_at_k.py" = ["E501"]
"examples/04_comparison_table.py" = ["E501"]
"examples/05_11be_ldpc_per.py" = ["E501"]
"src/mmw60/compare.py" = ["E501"]
"src/mmw60/power.py" = ["E501"]
