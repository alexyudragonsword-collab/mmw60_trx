name: ci

# lint + tests (jit and no-jit) + every example at smoke size + vendor drift +
# the numerical fingerprint, on every push / PR (d2d_link's workflow method).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # pushes are never cancelled: each run's fingerprint job judges the commits
  # its push brought; pull requests share one group per ref
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            jit: "1"
          - python: "3.12"
            jit: "1"
          - python: "3.12"
            jit: "0"     # MMW60_NO_JIT=1: the numpy Viterbi kernel must give the same bits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.jit }}" = "1" ]; then pip install -e ".[test,jit]"; else pip install -e ".[test]"; fi
      - name: Tests
        env:
          MMW60_NO_JIT: ${{ matrix.jit == '0' && '1' || '' }}
        run: pytest -q

  examples:
    # every example end to end at smoke size (tools/run_examples.py --smoke):
    # the code paths, not the numbers (examples/expected/ holds those)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,jit]"
      - name: Run every example (smoke size)
        run: python tools/run_examples.py --smoke --jobs 2

  # The page in a real Chromium against the real host (tests/test_webui.py).
  # Without Playwright those tests skip (the matrix above runs them that way);
  # here the skip is a failure (MMW60_REQUIRE_BROWSER=1), so a green run that
  # tested nothing cannot pass for one that did (array_tx's method).
  test-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the page-test extra and a Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui-test,jit]"
          python -m playwright install --with-deps chromium
      - name: Page, host and store tests (real browser, real host)
        env:
          MMW60_REQUIRE_BROWSER: "1"
        run: pytest -q tests/test_webui.py tests/test_webhost.py tests/test_guistore.py

  # The phone app (android/) is built with the numpy and scipy Chaquopy has for
  # Python 3.10, which are older than the floors pyproject.toml declares, and
  # without matplotlib or numba.  A dependency floor that no job runs is a claim,
  # not a fact (polar_tx found its own broken on a phone), so this job installs
  # exactly android/phone-stack.txt and runs what the phone runs: the bridge
  # path, every job at smoke size and the self-check against the shipped numbers.
  test-phone-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"       # chaquopy.version in android/app/build.gradle.kts
      - name: Install exactly the app's stack
        run: |
          python -m pip install --upgrade pip
          pip install -r android/phone-stack.txt pyyaml pytest
          pip install --no-deps -e .
          python -c "import importlib.util as u; assert not u.find_spec('matplotlib') and not u.find_spec('numba')"
      - name: Bridge, host, store and compute-layer tests on that stack
        run: pytest -q tests/test_webhost.py tests/test_guistore.py tests/test_guiutil.py tests/test_android.py -m "not slow"
      - name: Self-check against the shipped baseline, and every job at smoke size
        run: python -m mmw60.appbridge --jobs

  # Vendor drift: src/mmw60/vendor/wifitrx must still match the pinned
  # wifi_trx_cal commit.  wifi_trx_cal is a private repository: the checkout
  # needs a SIBLING_READ_TOKEN secret with read access to it (polar_tx's
  # method).  Without the secret the checkout fails, every file is skipped
  # and --fail-on-skip turns the job red on purpose: an unverified vendor
  # tree is not a pass.
  vendor-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: mmw60_trx
      - name: Checkout wifi_trx_cal (pinned)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: alexyudragonsword-collab/wifi_trx_cal
          ref: a8edf503df74cf11d6069a6354c4c0ddbf6e82d1
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          path: _siblings/wifi_trx_cal
      # spec_sources is public: no token (mmw60_trx#21)
      - name: Checkout spec_sources (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/spec_sources
          ref: 65ff5e44146d257f2a26955cf0af0eb005fbd308
          path: _siblings/spec_sources
      # array_tx is public: no token (milestone 2, the array layer)
      - name: Checkout array_tx (pinned)
        uses: actions/checkout@v4
        with:
          repository: alexyudragonsword-collab/array_tx
          ref: 286609e99c495712e026a913d4a2a066be11352c
          path: _siblings/array_tx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vendor drift check
        working-directory: mmw60_trx
        run: >
          python tools/vendor_check.py --strict --fail-on-skip
          --siblings wifi_trx_cal=${{ github.workspace }}/_siblings/wifi_trx_cal
          spec_sources=${{ github.workspace }}/_siblings/spec_sources
          array_tx=${{ github.workspace }}/_siblings/array_tx

  # Iron rule 7: a change that is not meant to move a number must not move
  # one.  Base and head are fingerprinted on the same runner and compared;
  # the escape hatch is the PR label `numbers-move` or "(numbers-move" in a
  # commit message, settled commit by commit by tools/fingerprint_walk.py.
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,jit]"
      - name: Record the head
        run: python tools/fingerprint.py record head.json
      - name: Pick the base
        id: base
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.base.sha }}"
          elif [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            sha="$before"
          else
            git fetch --no-tags origin main >/dev/null 2>&1 || true
            sha="$(git merge-base HEAD origin/main 2>/dev/null || true)"
            if [ "$sha" = "$(git rev-parse HEAD)" ]; then sha="$(git rev-parse HEAD^ 2>/dev/null || true)"; fi
            echo "::notice::no previous head for this push; comparing with $sha"
          fi
          if [ -z "$sha" ]; then echo "::notice::no base to compare the fingerprint with (first commit)"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Record the base
        if: steps.base.outputs.sha != ''
        run: |
          git worktree add ../base ${{ steps.base.outputs.sha }}
          pip install --no-deps -e ../base
          (cd ../base && python tools/fingerprint.py record "$GITHUB_WORKSPACE/base.json")
          pip install --no-deps -e .
      - name: Compare
        if: steps.base.outputs.sha != ''
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          python tools/fingerprint.py compare base.json head.json > diff.txt || true
          cat diff.txt
          python tools/fingerprint_walk.py --base "$BASE" --base-json base.json --head-json head.json --labels "$PR_LABELS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fingerprint
          path: |
            head.json
            base.json
            diff.txt
          if-no-files-found: ignore
          retention-days: 30
