name: android

# The phone app: build the APK, read what went into it, then run it on an
# emulator.  A Chaquopy build downloads an SDK, a CPython and native wheels per
# ABI and the emulator run adds minutes more, so this runs when the app shell
# or the bridge changes and on demand -- not on every push.  The bridge and
# the page are tested on every push without Android (tests/test_webhost.py,
# tests/test_android.py, tests/test_webui.py, and the test-phone-stack job of
# ci.yml on the app's own numpy / scipy).
#
# Dispatch it by hand before a release and after a change under src/mmw60
# that the paths below do not catch; pick the branch under test.

on:
  workflow_dispatch:
  workflow_call:             # release.yml runs this very job before it tags anything
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "src/mmw60/appbridge.py"
      - "pyproject.toml"

concurrency:
  # github.workflow is the caller's name when release.yml calls this, so a release
  # and a push to the same branch do not cancel each other
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60        # an emulator that never boots otherwise burns the 6 h default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"       # must match chaquopy.version in android/app/build.gradle.kts (it compiles the .pyc)
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2"
      - name: Build the APK
        run: gradle -p android :app:assembleDebug
      - name: What went into the APK
        run: >
          python android/tools/check_apk.py android/app/build/outputs/apk/debug/app-debug.apk
          src/mmw60/webui/www android/phone-stack.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mmw60-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # A built APK says nothing about whether the app runs.  The instrumented
      # tests start Python on the device, run the library's own self-check
      # (the analytic table recomputed there against the shipped one), open the
      # page in the WebView until it has drawn the table, press back, rotate,
      # and put the system in dark mode.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disk-size: 6000M
          working-directory: android
          script: gradle :app:connectedDebugAndroidTest
      # after the step that can fail, and always: under `set -e` a check that
      # sits behind a failure neither runs nor reports
      - name: The on-device tests actually ran
        if: always()
        run: |
          python android/tools/check_ondevice_results.py android/app/build/outputs/androidTest-results/connected 5
          # once more at the very end, where a truncated log still reaches: what the APK carries
          python android/tools/check_apk.py android/app/build/outputs/apk/debug/app-debug.apk \
            src/mmw60/webui/www android/phone-stack.txt
