# Numbers the docs derive from the examples' outputs (Halo_Serdes / d2d_link method):
# each entry says where its operands are printed and which doc text quotes the
# result; `python tools/example_drift.py derived` checks every quote against
# examples/expected/, and `compare` re-derives them from a new run.  In a `line`
# pattern `{}` captures a number and `{*}` skips one.

- name: ex00 K=8 MCS0, literal vs flat channel at PER 1e-2 (what the channel assumption costs)
  values:
    lit: {example: "00", after: "SNR at PER 1e-2", line: "8 0 {} {*} {*}"}
    flat: {example: "00", after: "SNR at PER 1e-2", line: "8 0 {*} {*} {}"}
  quotes:
    - {doc: cairn/external-validation.md, text: "K = 8 MCS0 字面 {lit} dB、flat {flat} dB，信道假设值 {lit - flat} dB"}

- name: ex00 K=8 MCS1, literal vs flat channel at PER 1e-2
  values:
    lit1: {example: "00", after: "SNR at PER 1e-2", line: "8 1 {} {*} {*}"}
    flat1: {example: "00", after: "SNR at PER 1e-2", line: "8 1 {*} {*} {}"}
  quotes:
    - {doc: cairn/external-validation.md, text: "K = 8 MCS1 字面 {lit1} dB、flat {flat1} dB"}

- name: ex04 11be 80 MHz x 4 is the best row (rate and pJ/bit at the cap)
  values:
    rate: {example: "04", after: "== 4. power blocks per bit", line: "be_upclocked 11be 80M K=4 @60.48 GHz {} {*} {*} {*} {*} {*} {*} {*}"}
    pj: {example: "04", after: "== 4. power blocks per bit", line: "be_upclocked 11be 80M K=4 @60.48 GHz {*} {*} {*} {*} {*} {*} {*} {}"}
  quotes:
    - {doc: cairn/comparison-table.md, text: "11be 80 MHz × 4（320 MHz）以 {rate} Mb/s、{pj} pJ/bit 居首"}

- name: ex04 20 MHz base, K = 16 vs K = 32 pJ/bit (K = 32 is worse per bit)
  values:
    k16: {example: "04", after: "== 4. power blocks per bit", line: "be_upclocked 11ac 20M K=16 @60.48 GHz {*} {*} {*} {*} {*} {*} {*} {}"}
    k32: {example: "04", after: "== 4. power blocks per bit", line: "be_upclocked 11ac 20M K=32 @60.48 GHz {*} {*} {*} {*} {*} {*} {*} {}"}
    k1: {example: "04", after: "== 4. power blocks per bit", line: "be 11ac 20M K=1 @6 GHz (WiFi 7 chain) {*} {*} {*} {*} {*} {*} {*} {}"}
  quotes:
    - {doc: cairn/comparison-table.md, text: "K = 16 的 {k16} pJ/bit 到 K = 32 升到 {k32}"}
    - {doc: cairn/comparison-table.md, text: "是 {k1} pJ/bit，是 K = 16 的 {k1 / k16} 倍"}

- name: ex05 11be 80 MHz MCS4 — the TX-EVM cap says beyond, the decoder reaches PER 1e-2 (what the cap criterion is worth)
  values:
    id4: {example: "05", after: "== SNR at PER 1e-2 [dB]: ideal / impaired", line: "4 4 {} {*} {*} MCS{*} MCS{*} beyond cap / reached {*} {*}"}
    i4: {example: "05", after: "== SNR at PER 1e-2 [dB]: ideal / impaired", line: "4 4 {*} {} {*} MCS{*} MCS{*} beyond cap / reached {*} {*}"}
    i8: {example: "05", after: "== SNR at PER 1e-2 [dB]: ideal / impaired", line: "8 4 {*} {} {*} MCS{*} MCS{*} beyond cap / reached {*} {*}"}
  quotes:
    - {doc: cairn/comparison-table.md, text: "PER 却在 {i4} / {i8} dB 到了 1e-2，只比 ideal 的 {id4} 贵 {i4 - id4} / {i8 - id4} dB"}

- name: ex04 decoder cap vs conformance cap on 11be 80 MHz x 4 (rate doubles, pJ/bit halves)
  values:
    rate_dec: {example: "04", after: "== 4b. the decoder's cap", line: "be_upclocked 11be 80M K=4 @60.48 GHz {*} MCS{*} MCS{*} {*} {*} {*} MCS{*} {} {*}"}
    pj_dec: {example: "04", after: "== 4b. the decoder's cap", line: "be_upclocked 11be 80M K=4 @60.48 GHz {*} MCS{*} MCS{*} {*} {*} {*} MCS{*} {*} {}"}
    pj_conf: {example: "04", after: "== 4. power blocks per bit", line: "be_upclocked 11be 80M K=4 @60.48 GHz {*} {*} {*} {*} {*} {*} {*} {}"}
  quotes:
    - {doc: cairn/comparison-table.md, text: "11be 80 MHz × 4 从 432 Mb/s / {pj_conf} 到 {rate_dec} Mb/s / {pj_dec}"}

- name: ex05 decoder-cap prediction vs measured PER threshold in the linear region
  values:
    p4: {example: "05", after: "== the decoder cap", line: "4 320 {*} MCS4 {*} {} {*} MCS5: {*} {*}"}
    m4: {example: "05", after: "== the decoder cap", line: "4 320 {*} MCS4 {*} {*} {} MCS5: {*} {*}"}
    p8: {example: "05", after: "== the decoder cap", line: "8 640 {*} MCS3 {*} {} {*} MCS4: {*} {*}"}
    m8: {example: "05", after: "== the decoder cap", line: "8 640 {*} MCS3 {*} {*} {} MCS4: {*} {*}"}
  quotes:
    - {doc: cairn/comparison-table.md, text: "| 4 | MCS4：{p4} / {m4} |"}
    - {doc: cairn/comparison-table.md, text: "| 8 | MCS3：{p8} / {m8} |"}
