    rate32: {example: "04", after: "== 4. power blocks per bit", line: "be_upclocked 11ac 20M K=32 @60.48 GHz {} {*} {*} {*} — {*} {*} {*}"}
    pj32: {example: "04", after: "== 4. power blocks per bit", line: "be_upclocked 11ac 20M K=32 @60.48 GHz {*} {*} {*} {*} — {*} {*} {}"}
    rate4: {example: "04", after: "== 4. power blocks per bit", line: "be_upclocked 11be 80M K=4 @60.48 GHz {} {*} {*} {*} — {*} {*} {*}"}
    pj4: {example: "04", after: "== 4. power blocks per bit", line: "be_upclocked 11be 80M K=4 @60.48 GHz {*} {*} {*} {*} — {*} {*} {}"}
  quotes:
