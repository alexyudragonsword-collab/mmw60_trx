    lit: {example: "00", after: "== SNR at PER 1e-2 [dB] ==", line: "8 0 {} {*} {*}"}
    flat: {example: "00", after: "== SNR at PER 1e-2 [dB] ==", line: "8 0 {*} {*} {}"}
  quotes:
    - {doc: cairn/external-validation.md, text: "K = 8 MCS0 字面 {lit} dB、flat {flat} dB，信道假设值 {lit - flat} dB"}

